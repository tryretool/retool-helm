name: Lint and Test Charts

# This file shamelessly ripped from datadog's helm chart setup
# https://github.com/DataDog/helm-charts/blob/main/.github/workflows/ci.yaml

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.list-changed.outputs.changed }}
      # Whether the chart jobs should run. False for PRs that don't touch any
      # chart (the workflow still runs so the kube-install-validated required
      # check always reports).
      run: ${{ steps.list-changed.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v3.5
        with:
          version: v3.6.3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.1
      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          CT_DEBUG: "false"
        run: |
          if [ "${GITHUB_REF}" == "refs/heads/main" ]; then
            # On main, run everything against all charts
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "Charts changed: $changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed<<EOF_CHANGED"
              echo "$changed"
              echo "EOF_CHANGED"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No chart changes - skipping chart jobs"
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "changed=" >> "$GITHUB_OUTPUT"

  lint-chart:
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs:
      - changed
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.1
      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml

  kubeconform-chart:
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs:
      - changed
    strategy:
      matrix:
        # When changing versions here, check that the version exists at:
        # https://github.com/yannh/kubernetes-json-schema
        k8s:
          - v1.37.1
          - v1.36.5
          - v1.35.9
          - v1.34.12
          - v1.33.13
          - v1.32.13
          - v1.31.14
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Run kubeconform
        env:
          KUBERNETES_VERSION: ${{ matrix.k8s }}
          CHANGED_CHARTS: ${{needs.changed.outputs.charts}}
        run: .github/kubeconform.sh

  install-chart:
    name: install-chart
    if: needs.changed.outputs.run == 'true'
    runs-on:
      group: retool-helm-kind-runners
    needs:
      - changed
      - lint-chart
      - kubeconform-chart
    strategy:
      max-parallel: 1
      matrix:
        # Only keep the newest and oldest kubeconform versions because these take
        # ~5 min each to run :(
        k8s:
          - v1.37.0
          - v1.31.14
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Create kind ${{ matrix.k8s }} cluster
        uses: helm/kind-action@v1.15.1
        with:
          node_image: kindest/node:${{ matrix.k8s }}
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.1
      - name: Run chart-testing (install)
        run: ct install --config .github/ct.yaml

  test-apparmor:
    name: test-apparmor
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs:
      - changed
      - lint-chart
      - kubeconform-chart
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v3.5
        with:
          version: v3.6.3
      - name: Run AppArmor integration test
        run: sudo .github/test-apparmor.sh --cleanup

  # Single required status check for branch protection. Required checks treat
  # skipped jobs as passing, so this job runs unconditionally and fails
  # explicitly unless everything upstream succeeded (or was intentionally
  # skipped because the PR has no chart changes).
  kube-install-validated:
    name: kube-install-validated
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changed
      - lint-chart
      - kubeconform-chart
      - install-chart
      - test-apparmor
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Fail if chart jobs were skipped unexpectedly
        if: needs.changed.outputs.run == 'true' && contains(needs.*.result, 'skipped')
        run: exit 1
      - name: validate
        run: echo "PR OK"
