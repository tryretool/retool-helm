{{- if eq (include "retool.rr.componentEnabled" (dict "root" $ "component" "jsExecutor")) "1" }}
{{- $nodeSelector := .Values.rr.jsExecutor.nodeSelector | default .Values.nodeSelector -}}
{{- $tolerations := .Values.rr.jsExecutor.tolerations | default .Values.tolerations -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "retool.jsExecutor.name" . }}
  labels:
    {{- include "retool.jsExecutor.selectorLabels" . | nindent 4 }}
    {{- include "retool.jsExecutor.labels" . | nindent 4 }}
    {{- include "retool.labels" . | nindent 4 }}
{{- if .Values.deployment.labels }}
{{ toYaml .Values.deployment.labels | indent 4 }}
{{- end }}
{{- if .Values.deployment.annotations }}
  annotations:
{{ toYaml .Values.deployment.annotations | indent 4 }}
{{- end }}
spec:
  {{- if not ((.Values.rr.jsExecutor.autoscaling).enabled) }}
  replicas: {{ .Values.rr.jsExecutor.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "retool.jsExecutor.selectorLabels" . | nindent 6 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  template:
    metadata:
      annotations:
        checksum/seccomp: {{ .Files.Get "files/nsjail-seccomp.json" | sha256sum }}
{{- if .Values.codeExecutor.appArmorProfileInstaller }}
        container.apparmor.security.beta.kubernetes.io/js-executor: localhost/retool-executor
{{- else }}
        container.apparmor.security.beta.kubernetes.io/js-executor: unconfined
{{- end }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
{{- if .Values.rr.jsExecutor.annotations }}
{{ toYaml .Values.rr.jsExecutor.annotations | indent 8 }}
{{- end }}
      labels:
        {{- include "retool.jsExecutor.selectorLabels" . | nindent 8 }}
        {{- include "retool.jsExecutor.labels" . | nindent 8 }}
        {{- include "retool.labels" . | nindent 8 }}
{{- if .Values.podLabels }}
{{ toYaml .Values.podLabels | indent 8 }}
{{- end }}
{{- if .Values.rr.jsExecutor.labels }}
{{ toYaml .Values.rr.jsExecutor.labels | indent 8 }}
{{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.rr.jsExecutor.terminationGracePeriodSeconds | default 391 }}
      serviceAccountName: {{ template "retool.serviceAccountName" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: "{{ .Values.priorityClassName }}"
      {{- end }}
      initContainers:
        - name: install-seccomp
          image: {{ include "retool.initImage" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
          command:
            - /bin/sh
            - -c
            - |
              DEST="/host-seccomp/{{ .Values.rr.jsExecutor.seccompLocalhostProfile }}"
              mkdir -p "$(dirname "$DEST")"
              cp /seccomp-profile/nsjail-seccomp.json "$DEST"
              echo "seccomp profile installed at $DEST"
          volumeMounts:
            - name: seccomp-profile
              mountPath: /seccomp-profile
            - name: host-seccomp
              mountPath: /host-seccomp
{{- if .Values.codeExecutor.appArmorProfileInstaller }}
        - name: wait-for-apparmor
          image: busybox:1.37.0@sha256:b3255e7dfbcd10cb367af0d409747d511aeb66dfac98cf30e97e87e4207dd76f
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
          command:
            - /bin/sh
            - -c
            - |
              until [ -f /host-run/retool-executor.loaded ]; do
                echo "Waiting for AppArmor profile retool-executor to be loaded by DaemonSet..."
                sleep 2
              done
              echo "AppArmor profile retool-executor loaded"
          volumeMounts:
            - name: host-run
              mountPath: /host-run
              readOnly: true
{{- end }}
{{- if .Values.initContainers }}
{{- range $key, $value := .Values.initContainers }}
        - name: "{{ $key }}"
{{ toYaml $value | indent 10 }}
{{- end }}
{{- end }}
      containers:
      - name: js-executor
        image: "{{ .Values.rr.jsExecutor.image.repository }}:{{ include "retool.jsExecutor.image.tag" . }}"
        imagePullPolicy: {{ .Values.rr.jsExecutor.image.pullPolicy | default .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            {{- if include "retool.jsExecutor.requiresNetAdmin" . }}
            # Older JSE versions run as root at startup to install the iptables rules
            # that restrict the sandboxes' network access: NET_ADMIN, plus NET_RAW for
            # iptables-legacy's raw socket. It then drops to retool_user, which needs
            # SETUID and SETGID.
            add: ["NET_ADMIN", "NET_RAW", "SETUID", "SETGID"]
            {{- else }}
            # Startup runs as root, then drops to retool_user, which needs SETUID and
            # SETGID. Network isolation is handled by the token-swapping proxy, so the
            # iptables capabilities (NET_ADMIN, NET_RAW) are not needed.
            #
            # NOTE: On 4.34 through 4.57 this assumes the jsExecutorTokenSwappingProxy flag
            # is on, which is the default for on-prem since 4.34. The flag is an org-level
            # setting that this chart cannot see. If it was toggled off, sandboxed code
            # shares the host network and the iptables rules are the only network
            # isolation, so NET_ADMIN and NET_RAW are required. From 4.58 the iptables
            # rules no longer exist and the proxy is always used.
            add: ["SETUID", "SETGID"]
            {{- end }}
          seccompProfile:
            type: Localhost
            localhostProfile: {{ .Values.rr.jsExecutor.seccompLocalhostProfile }}
        env:
          - name: DEPLOYMENT_TEMPLATE_TYPE
            value: {{ template "retool.deploymentTemplateType" . }}
          - name: DEPLOYMENT_TEMPLATE_VERSION
            value: {{ template "retool.deploymentTemplateVersion" . }}
          - name: NODE_ENV
            value: production
          {{- if include "retool.jsExecutor.skipIptablesEnv" . }}
          # Without NET_ADMIN the JSE cannot install iptables rules, so skip that step.
          # Only safe while jsExecutorTokenSwappingProxy is on (default for on-prem
          # since 4.34); if it was toggled off, the iptables rules are needed.
          # JSE 4.58+ has no iptables step, so this is not set there.
          - name: DISABLE_IPTABLES_SECURITY_CONFIGURATION
            value: "true"
          {{- end }}
          {{- include "retool.telemetry.includeEnvVars" . | nindent 10 }}
          {{- include "retool.env" .Values.rr.jsExecutor.env | nindent 10 }}
          {{- range .Values.rr.jsExecutor.environmentSecrets }}
          - name: {{ .name }}
            valueFrom:
              secretKeyRef:
                name: {{ .secretKeyRef.name }}
                key: {{ .secretKeyRef.key }}
          {{- end }}
          {{- with .Values.rr.jsExecutor.environmentVariables }}
{{ toYaml . | indent 10 }}
          {{- end }}
        ports:
        - containerPort: 3000
          name: http-server
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            {{- with .Values.livenessProbe.host }}
            host: {{ . | quote }}
            {{- end }}
            {{- with .Values.livenessProbe.scheme }}
            scheme: {{ . }}
            {{- end }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold:  {{ .Values.livenessProbe.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /api/readiness
            port: 3000
            {{- with .Values.readinessProbe.host }}
            host: {{ . | quote }}
            {{- end }}
            {{- with .Values.readinessProbe.scheme }}
            scheme: {{ . }}
            {{- end }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
        {{- include "retool.startupProbe" (dict "probe" .Values.rr.jsExecutor.startupProbe "port" 3000) | nindent 8 }}
        resources:
{{ toYaml .Values.rr.jsExecutor.resources | indent 10 }}
        volumeMounts:
{{- if .Values.rr.jsExecutor.volumeMounts }}
{{ toYaml .Values.rr.jsExecutor.volumeMounts | indent 10 }}
{{- end }}
{{- if .Values.extraVolumeMounts }}
{{ toYaml .Values.extraVolumeMounts | indent 10 }}
{{- end }}
{{- range .Values.extraConfigMapMounts }}
          - name: {{ .name }}
            mountPath: {{ .mountPath }}
            subPath: {{ .subPath }}
{{- end }}
{{- with .Values.extraContainers }}
{{ tpl . $ | indent 6 }}
{{- end }}
      volumes:
        - name: seccomp-profile
          configMap:
            name: {{ template "retool.fullname" . }}-js-executor-seccomp
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
{{- if .Values.codeExecutor.appArmorProfileInstaller }}
        - name: host-run
          hostPath:
            path: /run/retool/apparmor
            type: DirectoryOrCreate
{{- end }}
{{- if .Values.rr.jsExecutor.volumes }}
{{ toYaml .Values.rr.jsExecutor.volumes | indent 8 }}
{{- end }}
{{- range .Values.extraConfigMapMounts }}
        - name: {{ .name }}
          configMap:
            name: {{ .configMap }}
{{- end }}
{{- if .Values.extraVolumes }}
{{ toYaml .Values.extraVolumes | indent 8 }}
{{- end }}
{{- if .Values.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.image.pullSecrets | indent 8 }}
{{- end }}
{{- if .Values.rr.jsExecutor.affinity }}
      affinity:
{{ toYaml .Values.rr.jsExecutor.affinity | indent 8 }}
{{- end }}
{{- if $nodeSelector }}
      nodeSelector:
{{ toYaml $nodeSelector | indent 8 }}
{{- end }}
      tolerations:
{{ toYaml $tolerations | indent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ template "retool.jsExecutor.name" . }}
spec:
  selector:
    {{- include "retool.jsExecutor.selectorLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
    name: http-server
---
{{- if .Values.podDisruptionBudget }}
{{- if semverCompare ">=1.21-0" .Capabilities.KubeVersion.Version -}}
apiVersion: policy/v1
{{- else -}}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ template "retool.jsExecutor.name" . }}
spec:
  {{- toYaml .Values.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
  {{- include "retool.jsExecutor.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if (.Values.rr.jsExecutor.autoscaling).enabled }}
{{- $hpa := .Values.rr.jsExecutor.autoscaling }}
{{- $requests := ((.Values.rr.jsExecutor.resources).requests | default dict) }}
{{- if and $hpa.targetCPUUtilizationPercentage (not $requests.cpu) }}
{{- fail "rr.jsExecutor.autoscaling.targetCPUUtilizationPercentage requires rr.jsExecutor.resources.requests.cpu. CPU utilization is unavailable without a CPU request, so the HPA cannot scale on CPU. Set a CPU request or unset targetCPUUtilizationPercentage." }}
{{- end }}
{{- if and $hpa.targetMemoryUtilizationPercentage (not $requests.memory) }}
{{- fail "rr.jsExecutor.autoscaling.targetMemoryUtilizationPercentage requires rr.jsExecutor.resources.requests.memory. Memory utilization is unavailable without a memory request, so the HPA cannot scale on memory. Set a memory request or unset targetMemoryUtilizationPercentage." }}
{{- end }}
{{- with $hpa.metrics }}
{{- fail "rr.jsExecutor.autoscaling.metrics is not supported. The JS executor HPA scales only on CPU and memory via targetCPUUtilizationPercentage and targetMemoryUtilizationPercentage." }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "retool.jsExecutor.name" . }}
  labels:
    {{- include "retool.jsExecutor.selectorLabels" . | nindent 4 }}
    {{- include "retool.jsExecutor.labels" . | nindent 4 }}
    {{- include "retool.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ template "retool.jsExecutor.name" . }}
  minReplicas: {{ .Values.rr.jsExecutor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.rr.jsExecutor.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.rr.jsExecutor.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.rr.jsExecutor.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.rr.jsExecutor.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.rr.jsExecutor.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  {{- with .Values.rr.jsExecutor.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
