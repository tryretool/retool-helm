{{- /* Dedicated service accounts for the executors (serviceAccount.create on each). */ -}}
{{- if eq (include "retool.codeExecutor.enabled" .) "1" }}
{{- include "retool.workloadServiceAccount" (dict "root" $ "sa" .Values.codeExecutor.serviceAccount "default" (include "retool.codeExecutor.name" .) "labels" (include "retool.codeExecutor.labels" .)) }}
{{- end }}
{{- if eq (include "retool.rr.componentEnabled" (dict "root" $ "component" "jsExecutor")) "1" }}
{{- include "retool.workloadServiceAccount" (dict "root" $ "sa" .Values.rr.jsExecutor.serviceAccount "default" (include "retool.jsExecutor.name" .) "labels" (include "retool.jsExecutor.labels" .)) }}
{{- end }}
