{{- $mcpEnabled := ((.Values.mcp).enabled) | default false -}}
{{- $backendInternalService := (((.Values.mcp).backendMetadata).service) | default dict -}}
{{- $backendInternalServiceEnabled := $mcpEnabled -}}
{{- if hasKey $backendInternalService "enabled" -}}
{{- $backendInternalServiceEnabled = and $mcpEnabled $backendInternalService.enabled -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "retool.labels" . | nindent 4 }}
  {{- range $key, $value := .Values.service.labels }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  name: {{ template "retool.fullname" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- range $key, $value := . }}
      {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- range $cidr := .Values.service.loadBalancerSourceRanges }}
    - {{ $cidr }}
    {{- end }}
  {{- end }}
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "ClusterIP") .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  ports:
    - port: {{ .Values.service.externalPort }}
      targetPort: {{ .Values.service.internalPort }}
      protocol: TCP
{{- if (and (eq .Values.service.type "NodePort") (not (empty .Values.service.nodePort))) }}
      nodePort: {{ .Values.service.nodePort }}
{{- end }}
{{- if .Values.service.portName }}
      name: {{ .Values.service.portName }}
{{- end }}
{{- if .Values.service.externalIPs }}
  externalIPs:
{{ toYaml .Values.service.externalIPs | indent 4 }}
{{- end }}
  selector:
{{- include "retool.selectorLabels" . | nindent 4 }}
{{- range $key, $value := .Values.service.selector }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
{{- end }}
{{- if $backendInternalServiceEnabled }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "retool.labels" . | nindent 4 }}
  {{- range $key, $value := $backendInternalService.labels }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  name: {{ template "retool.backendInternal.name" . }}
  {{- with $backendInternalService.annotations }}
  annotations:
    {{- range $key, $value := . }}
      {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: {{ $backendInternalService.portName | default "http-api" }}
      port: {{ $backendInternalService.externalPort | default 3001 }}
      targetPort: {{ $backendInternalService.internalPort | default 3001 }}
      protocol: TCP
  selector:
{{- include "retool.selectorLabels" . | nindent 4 }}
{{- range $key, $value := .Values.service.selector }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- if and (eq (include "retool.appServingLayer.enabled" .) "1") (not (include "retool.appServingLayer.separateEnabled" .)) }}
{{- /*
  The serving layer runs in-process on the main backend, so this service points at
  the backend pods on the serving-layer port. When it is split out, the equivalent
  service is rendered next to its deployment instead (same name, so the ingress rule
  routing the apps wildcard host works in both modes).
*/}}
{{- $appServingLayerService := .Values.rr.appServingLayer.service | default dict }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "retool.labels" . | nindent 4 }}
  {{- range $key, $value := $appServingLayerService.labels }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  name: {{ template "retool.appServingLayer.name" . }}
  {{- with $appServingLayerService.annotations }}
  annotations:
    {{- range $key, $value := . }}
      {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http-server
      port: {{ include "retool.appServingLayer.port" . }}
      targetPort: {{ include "retool.appServingLayer.port" . }}
      protocol: TCP
  selector:
{{- include "retool.selectorLabels" . | nindent 4 }}
{{- range $key, $value := .Values.service.selector }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
