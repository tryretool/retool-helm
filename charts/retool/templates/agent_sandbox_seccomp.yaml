{{- if eq (include "retool.rr.componentEnabled" (dict "root" $ "component" "agentSandbox")) "1" }}
{{- $as := .Values.rr.agentSandbox -}}
{{- $nodeSelector := $as.nodeSelector | default .Values.nodeSelector -}}
{{- $tolerations := $as.tolerations | default .Values.tolerations -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "retool.agentSandbox.name" . }}-seccomp
  labels:
    {{- include "retool.agentSandbox.labels" . | nindent 4 }}
    {{- include "retool.labels" . | nindent 4 }}
data:
  gvisor-seccomp.json: |
    {{- .Files.Get "files/gvisor-seccomp.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "retool.agentSandbox.name" . }}-node-installer
  labels:
    {{- include "retool.agentSandbox.labels" . | nindent 4 }}
    {{- include "retool.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-installer
spec:
  selector:
    matchLabels:
      retoolService: {{ include "retool.agentSandbox.name" . }}-node-installer
  template:
    metadata:
{{- if $as.appArmorProfileInstaller }}
      annotations:
        checksum/apparmor-profiles: {{ include (print $.Template.BasePath "/apparmor_agent_sandbox_configmap.yaml") . | sha256sum }}
{{- end }}
      labels:
        retoolService: {{ include "retool.agentSandbox.name" . }}-node-installer
        app.kubernetes.io/name: {{ include "retool.agentSandbox.name" . }}-node-installer
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "retool.labels" . | nindent 8 }}
{{- if .Values.podLabels }}
{{ toYaml .Values.podLabels | indent 8 }}
{{- end }}
    spec:
      automountServiceAccountToken: false
{{- if $nodeSelector }}
      nodeSelector:
{{ toYaml $nodeSelector | indent 8 }}
{{- end }}
      tolerations:
{{ toYaml $tolerations | indent 8 }}
{{- if $as.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
{{- end }}
{{- if $as.appArmorProfileInstaller }}
      hostPID: true
{{- end }}
      initContainers:
        - name: install-seccomp
          image: "{{ $as.initImage.repository }}:{{ $as.initImage.tag }}{{- if $as.initImage.digest }}@{{ $as.initImage.digest }}{{- end }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              DEST="/host-seccomp/{{ $as.seccompProfile }}"
              mkdir -p "$(dirname "$DEST")"
              cp /seccomp-profile/gvisor-seccomp.json "$DEST"
              echo "seccomp profile installed at $DEST"
          volumeMounts:
            - name: seccomp-profile
              mountPath: /seccomp-profile
            - name: host-seccomp
              mountPath: /host-seccomp
{{- if $as.appArmorProfileInstaller }}
        - name: install-apparmor
          image: "{{ $as.initImage.repository }}:{{ $as.initImage.tag }}{{- if $as.initImage.digest }}@{{ $as.initImage.digest }}{{- end }}"
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp /apparmor-profiles/retool-agent-sandbox /host-apparmor/retool-agent-sandbox
              if ! nsenter -t 1 -m -- which apparmor_parser >/dev/null 2>&1; then
                echo "ERROR: apparmor_parser not found on host but AppArmor profile installation was requested" >&2
                exit 1
              fi
              nsenter -t 1 -m -- apparmor_parser -r /etc/apparmor.d/retool-agent-sandbox
              echo "AppArmor profile retool-agent-sandbox loaded successfully"
          volumeMounts:
            - name: apparmor-profiles
              mountPath: /apparmor-profiles
              readOnly: true
            - name: host-apparmor
              mountPath: /host-apparmor
{{- end }}
      containers:
        - name: pause
          image: "{{ $as.initImage.repository }}:{{ $as.initImage.tag }}{{- if $as.initImage.digest }}@{{ $as.initImage.digest }}{{- end }}"
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: seccomp-profile
          configMap:
            name: {{ include "retool.agentSandbox.name" . }}-seccomp
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
{{- if $as.appArmorProfileInstaller }}
        - name: apparmor-profiles
          configMap:
            name: {{ include "retool.agentSandbox.name" . }}-apparmor
        - name: host-apparmor
          hostPath:
            path: /etc/apparmor.d
            type: DirectoryOrCreate
{{- end }}
{{- end }}
