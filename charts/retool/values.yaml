# Retool Helm chart values.
#
# Keys with a `# --` comment are documented in README.md and validated by
# values.schema.json; both are generated from this file by
# charts/retool/schema/generate.sh. See CONTRIBUTING.md for the conventions.

# @schema type: [string, null]
# -- (string) Override the chart name used in resource names.
nameOverride:
# @schema type: [string, null]
# -- (string) Override the full name used for resource names. Truncated to 63 characters.
fullnameOverride:

config:
  # -- Retool license key. Ignored when `config.licenseKeySecretName` is set.
  licenseKey: "EXPIRED-LICENSE-KEY-TRIAL"
  # @schema type: [string, null]
  # -- (string) Name of an existing Secret holding the license key. Use instead of `config.licenseKey`.
  licenseKeySecretName:
  # @schema type: [string, null]
  # -- (string) Key in `config.licenseKeySecretName` holding the license key.
  # @default -- `license-key`
  licenseKeySecretKey:
  # @schema type: [boolean, string]; enum: [true, false, "true", "false"]
  # -- Serve the session cookie without the `Secure` flag. Only enable this when Retool is served over plain HTTP.
  useInsecureCookies: false
  # @schema type: [integer, string, null]; pattern: ^[0-9]+$
  # -- (int) Query timeout in milliseconds. Sets `DBCONNECTOR_QUERY_TIMEOUT_MS`.
  # @default -- Retool's built-in default (120000)
  dbConnectorTimeout:
  # @schema type: [integer, string, null]; pattern: ^[0-9]+$
  # -- Maximum Postgres pool connections for the backend. Sets `DBCONNECTOR_POSTGRES_POOL_MAX_SIZE`.
  postgresPoolMaxSize: 10
  auth:
    google:
      # -- Set the `CLIENT_ID` and `CLIENT_SECRET` env vars for Google SSO. Defaults to true for backwards compatibility.
      enabled: true
      # @schema type: [string, null]
      # -- (string) Google OAuth client ID.
      clientId:
      # @schema type: [string, null]
      # -- (string) Google OAuth client secret. Ignored when `clientSecretSecretName` is set.
      clientSecret:
      # @schema type: [string, null]
      # -- (string) Name of an existing Secret holding the Google client secret. Use instead of `clientSecret`.
      clientSecretSecretName:
      # @schema type: [string, null]
      # -- (string) Key in `clientSecretSecretName` holding the Google client secret.
      # @default -- `google-client-secret`
      clientSecretSecretKey:
  # @schema type: [string, null]
  # -- (string) Key used to encrypt secrets stored in the Retool database. Required on first install unless `config.encryptionKeySecretName` is set. Never change it after install, or stored credentials become unreadable.
  encryptionKey:
  # @schema type: [string, null]
  # -- (string) Name of an existing Secret holding the encryption key. Use instead of `config.encryptionKey`.
  encryptionKeySecretName:
  # @schema type: [string, null]
  # -- (string) Key in `config.encryptionKeySecretName` holding the encryption key.
  # @default -- `encryption-key`
  encryptionKeySecretKey:
  # @schema type: [string, null]
  # -- (string) Secret used to sign session JWTs. When unset, one is generated on first install and reused on upgrade. Reuse relies on Helm `lookup`, so set it explicitly with tools that render via `helm template`, such as Argo CD.
  jwtSecret:
  # @schema type: [string, null]
  # -- (string) Name of an existing Secret holding the JWT secret. Use instead of `config.jwtSecret`.
  jwtSecretSecretName:
  # @schema type: [string, null]
  # -- (string) Key in `config.jwtSecretSecretName` holding the JWT secret.
  # @default -- `jwt-secret`
  jwtSecretSecretKey:

  # Connection to an external Postgres database. Only used when the bundled
  # postgresql subchart is disabled (postgresql.enabled: false).
  postgresql:
    # @schema type: [string, null]
    # -- (string) Hostname of the external Postgres database.
    host:
    # @schema type: [integer, string, null]; pattern: ^[0-9]+$
    # -- (int) Port of the external Postgres database.
    port:
    # @schema type: [string, null]
    # -- (string) Database name.
    db:
    # @schema type: [string, null]
    # -- (string) Alias for `config.postgresql.db`, used when `db` is unset.
    database:
    # @schema type: [string, null]
    # -- (string) Database user.
    user:
    # @schema type: [string, null]
    # -- (string) Database password. Ignored when `passwordSecretName` is set.
    password:
    # @schema type: [string, null]
    # -- (string) Name of an existing Secret holding the database password. Use instead of `password`.
    passwordSecretName:
    # @schema type: [string, null]
    # -- (string) Key in `passwordSecretName` holding the database password.
    # @default -- `postgresql-password`
    passwordSecretKey:
    # @schema type: [boolean, string, null]; enum: [true, false, "true", "false", null]
    # -- (bool) Connect to Postgres over SSL. Sets `POSTGRES_SSL_ENABLED`; set it here rather than in `env`.
    ssl_enabled:

image: # @schema required
  # -- Retool backend image repository.
  repository: "tryretool/backend"
  # @schema required; minLength: 1
  # -- Retool version to deploy, e.g. `3.148.12-stable`. Required: the chart does not pick a version for you.
  # @default -- none (required)
  tag: ""
  # @schema enum: [Always, IfNotPresent, Never]
  # -- Image pull policy for Retool containers.
  pullPolicy: "IfNotPresent"
  # @schema type: [array, null]
  # -- (list) Image pull secrets for Retool pods, e.g. `[{name: my-registry}]`.
  pullSecrets:

# The upstream busybox image is pinned to a known-good digest internally, but
# only while repository and tag are left at their defaults. Overriding either
# drops that pin automatically (a copied image gets a new digest, so the
# original would pin you back to the source registry and fail the pull).
initImage:
  # -- Utility image for the initContainers that install the nsjail seccomp profile on the host, used by the code executor and JS executor. Override it to pull from a private mirror, an air-gapped registry, or GCP Marketplace.
  repository: busybox
  # @schema type: [string, number]
  # -- Tag of the init image.
  tag: '1.37.0'
  # @schema type: [string, null]
  # -- Digest to pin a mirrored init image by, e.g. `sha256:...`.
  digest: ''

commandline:
  # -- Extra arguments for the backend container.
  args: []

# Example:
#   env:
#     BASE_DOMAIN: https://retool.example.com
#     DISABLE_GIT_SYNCING: "true"
# -- Environment variables for Retool containers, as `NAME: value`. A value can also be a map with `value` and/or `valueFrom`.
env: {}

# Example:
#   environmentSecrets:
#     - name: SCIM_AUTH_TOKEN
#       secretKeyRef:
#         name: retool-scim-auth-token
#         key: auth-token
# -- Environment variables populated from Kubernetes Secrets. Each item has `name` and `secretKeyRef` (`name`, `key`).
environmentSecrets: []

# Example:
#   environmentVariables:
#     - name: GITHUB_APP_PRIVATE_KEY
#       valueFrom:
#         secretKeyRef:
#           name: retool-github-app-private-key
#           key: private-key
#     - name: POD_HOST_IP
#       valueFrom:
#         fieldRef:
#           fieldPath: status.hostIP
# -- Environment variables in Kubernetes `EnvVar` form, for values `env` cannot express such as `valueFrom.fieldRef`.
environmentVariables: []

# Load environment variables from External Secrets. `enabled` (legacy
# kubernetes-external-secrets) and `externalSecretsOperator.enabled` are
# mutually exclusive.
externalSecrets:
  # -- Read env vars from the legacy [kubernetes-external-secrets](https://github.com/godaddy/kubernetes-external-secrets) controller. Deprecated in favour of `externalSecrets.externalSecretsOperator`.
  enabled: false
  # -- Also create the chart's config Secret while external secrets are enabled. It is skipped by default so it can't clobber keys supplied by the external secret.
  includeConfigSecrets: false
  # -- Name of the legacy external secret to read env vars from.
  name: retool-config
  # -- Additional legacy external secrets to read env vars from. Each item has a `name`.
  secrets: []
  externalSecretsOperator:
    # -- Read env vars through [External Secrets Operator](https://github.com/external-secrets/external-secrets).
    enabled: false
    # -- How often to re-read secrets from the provider, as a Go duration (`1m`, `1h`). `0` fetches once.
    refreshInterval: "1m"
    secretStoreRef:
      # -- Name of the SecretStore to read from.
      name: aws-secretsmanager
      # @schema enum: [SecretStore, ClusterSecretStore]
      # -- Kind of the store.
      kind: SecretStore
    # Example:
    #   secretRef:
    #     - name: retool-config
    #       path: global-retool-config
    #     - name: extra-secrets
    #       path: global-extra-secrets
    #       creationPolicy: Owner
    #       deletionPolicy: Retain
    #       optional: true
    # -- ExternalSecrets to create, each also added to pod `envFrom`. Each item needs `name` and `path`; `creationPolicy`, `deletionPolicy` and `optional` are optional.
    secretRef: []
    # -- Create `kubernetes-client.io/v1` (legacy) ExternalSecret resources instead of `external-secrets.io` ones.
    useLegacyCR: true
    # -- Backend type for legacy ExternalSecret resources.
    backendType: secretsManager

# -- Legacy. Config file mounts under `/usr/share/retool/config`, keyed by filename.
files: {}

deployment:
  # -- Labels added to Retool Deployments.
  labels: {}
  # -- Annotations added to Retool Deployments.
  annotations: {}

service:
  # @schema enum: [ClusterIP, NodePort, LoadBalancer]
  # -- Service type for the Retool backend.
  type: ClusterIP
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Service port.
  externalPort: 3000
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Container port the Service targets.
  internalPort: 3000
  # @schema type: [string, null]
  # -- (string) Fixed cluster IP. Only used with `type: ClusterIP`.
  clusterIP:
  # @schema type: [integer, string, null]; pattern: ^[0-9]+$
  # -- (int) Fixed node port. Only used with `type: NodePort`.
  nodePort:
  # @schema type: [array, null]
  # -- (list) External IPs for the Service.
  externalIPs:
  # @schema type: [string, null]
  # -- (string) Requested load balancer IP. Only used with `type: LoadBalancer`.
  loadBalancerIP:
  # @schema type: [array, null]
  # -- (list) CIDRs allowed to reach the load balancer, where the provider supports it.
  loadBalancerSourceRanges:
  # @schema type: [string, null]
  # -- (string) Name for the Service port.
  portName:
  # -- Annotations added to the Service.
  annotations: {}
  # -- Labels added to the Service.
  labels: {}
  # -- Extra selector labels for the Service.
  selector: {}

# Example:
#   ingress:
#     ingressClassName: nginx
#     hosts:
#       - host: retool.example.com
#         paths:
#           - path: /
#     tls:
#       - secretName: retool.example.com
#         hosts:
#           - retool.example.com
#
# For controllers that need extra rules ahead of the Retool path, such as the
# AWS ALB ssl-redirect action, add `extraPaths` to a host:
#       - host: retool.example.com
#         extraPaths:
#           - path: /*
#             backend:
#               service:
#                 name: ssl-redirect
#                 port:
#                   name: use-annotation
#             pathType: ImplementationSpecific
#         paths:
#           - path: /*
ingress:
  # -- Create an Ingress for Retool.
  enabled: true
  # @schema type: [string, null]
  # -- (string) IngressClass to use.
  ingressClassName:
  # -- Labels added to the Ingress.
  labels: {}
  # -- Annotations added to the Ingress.
  annotations: {}
  # @schema type: [string, null]
  # -- (string) Single host to route to Retool. When set, `hosts` is ignored.
  hostName:
  # @schema type: [array, null]
  # -- (list) Hosts to route. Each item has `host`, `paths` (each with a `path`) and optionally `extraPaths`, raw path entries placed first.
  hosts:
  # @schema type: [array, null]
  # -- (list) TLS configuration for the Ingress, in Kubernetes `IngressTLS` form.
  tls:
  # @schema type: [string, null]
  # -- Path type for the Retool paths. Set to null to omit it.
  pathType: ImplementationSpecific

# Example:
#   httpRoute:
#     enabled: true
#     parentRefs:
#       - name: my-gateway
#         namespace: default
#         sectionName: https
#     hostnames:
#       - retool.example.com
httpRoute:
  # -- Create a Gateway API HTTPRoute for Retool, as an alternative to `ingress`. Requires a Gateway API implementation (e.g. GKE Gateway, Istio, Envoy Gateway, NGINX Gateway Fabric).
  enabled: false
  # -- Labels added to the HTTPRoute.
  labels: {}
  # -- Annotations added to the HTTPRoute.
  annotations: {}
  # @schema type: [array, null]
  # -- (list) Gateways the route attaches to, in Gateway API `ParentReference` form.
  parentRefs:
  # @schema type: [array, null]
  # -- (list) Hostnames the route matches.
  hostnames:
  # @schema type: [array, null]
  # -- (list) Full HTTPRoute rules. When unset, a catch-all rule routes all traffic to the Retool backend.
  rules:

# Bundled Postgres (Bitnami postgresql subchart). We highly recommend you do
# NOT use it for a production instance of Retool; it is only suitable for
# proofs of concept. Use a managed Postgres instead: set enabled: false and
# configure config.postgresql.
#
# Any other value of the Bitnami postgresql chart can also be set here.
postgresql:
  # -- Deploy the bundled Postgres subchart. Not suitable for production.
  enabled: true
  # @schema type: [boolean, string]; enum: [true, false, "true", "false"]
  # -- Connect to the bundled Postgres over SSL. Sets `POSTGRES_SSL_ENABLED`.
  ssl_enabled: false
  auth:
    # -- Database name.
    database: hammerhead_production
    # -- Database user. With `postgres`, a random admin password is generated unless `postgresPassword` is set.
    username: postgres
    # -- Database password.
    password: retool
    # postgresPassword: retool
  service:
    # @schema type: [integer, string]; pattern: ^[0-9]+$
    # -- Postgres service port.
    port: 5432
  # The official image rather than bitnami/postgresql, since Retool depends on
  # the uuid-ossp extension.
  image:
    # -- Postgres image repository.
    repository: "postgres"
    # @schema type: [string, number]
    # -- Postgres image tag.
    tag: "13"
  # -- Postgres data directory.
  postgresqlDataDir: "/data/pgdata"
  primary:
    persistence:
      # -- Persist Postgres data in a PersistentVolumeClaim.
      enabled: true
      # -- Mount path of the Postgres volume.
      mountPath: "/data/"

serviceAccount:
  # -- Create a ServiceAccount for Retool.
  create: true
  # @schema type: [string, null]
  # -- (string) ServiceAccount to use. When `create` is true and this is unset, a name is generated from the full name. When `create` is false, it must already exist.
  name:
  # -- Annotations added to the ServiceAccount, e.g. for IRSA or Workload Identity.
  annotations: {}
  # -- Labels added to the ServiceAccount.
  labels: {}
  # -- Mount the ServiceAccount token into Retool pods.
  automountToken: false

# NetworkPolicy applied to the main Retool backend pods. Enforced only by CNIs
# that implement egress NetworkPolicy (Cilium, Calico, AWS VPC CNI
# network-policy agent); a no-op on CNIs that don't.
#
# blockCloudMetadataEgress closes the SSRF -> cloud metadata credential theft
# vector: backend pods execute user-defined resource requests and are the
# primary SSRF surface. All other egress stays allowed.
#
# Auto-on is safe for token-federated identities (EKS IRSA, GKE Workload
# Identity, Azure Workload Identity): they get credentials from a projected
# token file and the provider's STS/IAM endpoint, not the metadata service.
#
# But "no static credential" also covers metadata-based identities that the
# block breaks. Set it to false if blob storage authenticates via an EC2
# instance profile, a GCE default service account, or an Azure IMDS-based
# managed identity, or if a data source connection relies on the metadata
# endpoint (e.g. an IAM-role connection using the instance profile). Pair with
# IMDS hop-limit=1 at the node level and the application-layer SSRF filter.
networkPolicy:
  # @schema type: [boolean, null]
  # -- (bool) Block backend egress to the cloud metadata endpoint (169.254.169.254). `true`/`false` force it on or off.
  # @default -- null: on when blob storage is keyless (no static credential set), off otherwise
  blockCloudMetadataEgress:
  # -- Additional IPv4 CIDRs to deny in backend egress, e.g. private ranges user-defined requests should not reach.
  blockedRanges: []
  # -- IPv6 CIDRs to deny in backend egress. Empty leaves IPv6 egress fully allowed.
  blockedRanges6: []

livenessProbe:
  # -- Enable the backend liveness probe.
  enabled: true
  # -- HTTP path the probe requests.
  path: /api/checkHealth
  # @schema type: [string, null]
  # -- (string) Host the probe connects to. On IPv6-primary or dual-stack clusters, set `127.0.0.1` so the kubelet probes the IPv4 loopback; some services (e.g. code-executor) listen on IPv4 only.
  # @default -- the Pod IP
  host:
  # @schema type: [string, null]; enum: [HTTP, HTTPS, null]
  # -- (string) Scheme the probe uses.
  # @default -- `HTTP`
  scheme:
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds after container start before the first probe.
  initialDelaySeconds: 30
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds before the probe times out.
  timeoutSeconds: 10
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds between probes.
  periodSeconds: 10
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Consecutive failures before the container is restarted.
  failureThreshold: 3

readinessProbe:
  # -- Enable the backend readiness probe.
  enabled: true
  # -- HTTP path the probe requests.
  path: /api/checkHealth
  # @schema type: [string, null]
  # -- (string) Host the probe connects to. See `livenessProbe.host`.
  # @default -- the Pod IP
  host:
  # @schema type: [string, null]; enum: [HTTP, HTTPS, null]
  # -- (string) Scheme the probe uses.
  # @default -- `HTTP`
  scheme:
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds after container start before the first probe.
  initialDelaySeconds: 30
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds before the probe times out.
  timeoutSeconds: 10
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds between probes.
  periodSeconds: 10
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Consecutive successes before the pod is marked ready.
  successThreshold: 5

preStopHook:
  # -- Sleep 30 seconds before the backend container stops, so load balancers drain it first.
  enabled: true

# Other deployments have their own <component>.startupProbe, also enabled by
# default.
startupProbe:
  # -- Enable the backend startup probe.
  enabled: true
  # -- HTTP path the probe requests.
  path: /api/checkHealth
  # @schema type: [string, null]
  # -- (string) Host the probe connects to. See `livenessProbe.host`.
  # @default -- the Pod IP
  host:
  # @schema type: [string, null]; enum: [HTTP, HTTPS, null]
  # -- (string) Scheme the probe uses.
  # @default -- `HTTP`
  scheme:
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds after container start before the first probe.
  initialDelaySeconds: 0
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds before the probe times out.
  timeoutSeconds: 10
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Seconds between probes.
  periodSeconds: 10
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Consecutive successes before the probe passes.
  successThreshold: 1
  # @schema type: [integer, string]; pattern: ^[0-9]+$
  # -- Consecutive failures before the container is restarted. With the defaults, the backend has 5 minutes to start.
  failureThreshold: 30

# -- Extra containers added to the backend pods.
extraContainers: []

# -- Extra volume mounts added to Retool containers.
extraVolumeMounts: []

# -- Extra volumes added to Retool pods.
extraVolumes: []

# If you have more than 1 replica, the minimum recommended resources are
# cpu: 2048m and memory: 4096Mi. With only 1 replica, double those.
# @schema $ref: schema/definitions.json#/definitions/resources
# -- Resources for the backend, jobs-runner, dbconnector and workflows-backend pods, unless they set their own.
resources:
  # @schema hidden
  limits:
    cpu: 4096m
    memory: 8192Mi
  # @schema hidden
  requests:
    cpu: 2048m
    memory: 4096Mi

# -- PriorityClass for Retool pods.
priorityClassName: ""

# -- Affinity for Retool pods. The default prefers spreading Retool pods across nodes.
affinity:
  # @schema hidden
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: In
                values:
                  - retool
          topologyKey: "kubernetes.io/hostname"

# -- Tolerations for Retool pods.
tolerations: []

# -- Node selector for Retool pods.
nodeSelector:
  kubernetes.io/arch: amd64

# -- Annotations added to all Retool pods.
podAnnotations: {}

# @schema type: [integer, string]; pattern: ^[0-9]+$
# -- Number of old ReplicaSets to keep for rollbacks.
revisionHistoryLimit: 3

# Example:
#   podDisruptionBudget:
#     maxUnavailable: 1
# -- PodDisruptionBudget spec for Retool deployments, with `minAvailable` or `maxUnavailable` as a pod count (`1`) or a percentage (`"50%"`). Empty creates none.
podDisruptionBudget: {}

# -- Labels added to the backend and jobs-runner pods.
podLabels: {}

# Example 1: 1 replica gives 1 combined backend and jobs pod (unless
#   jobRunner.enabled is true).
# Example 2: 2 replicas give 2 backends + 1 jobs pod.
# Example 3: 3 replicas give 3 backends + 1 jobs pod.
# @schema type: [integer, string]; pattern: ^[0-9]+$
# -- Number of backend replicas. With more than 1, a separate jobs-runner pod is also deployed.
replicaCount: 2

# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
jobRunner:
  # explicitly enable this pod if exactly 1 api backend container and
  # 1 jobs runner container is desired. otherwise a replicaCount of 2
  # will already launch a job runner pod
  # enabled: true

  # If necessary, specify the resources to provision the jobRunner pod separately from the main backend pods.
  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 1000m
      memory: 2048Mi

  # Annotations for job runner pods
  annotations: {}

  # Labels for job runner pods
  labels: {}

  # Optional host/scheme: see top-level livenessProbe.
  startupProbe:
    enabled: true
    path: /api/checkJobsRunnerHealth
    initialDelaySeconds: 0
    timeoutSeconds: 3
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 18

# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
backend:
  # Annotations for backend pods
  annotations: {}

  # Labels for backend pods
  labels: {}

  # Make backend pods wait the specified time before kubernetes will forcibly kill them when they need to be rescheduled
  # By default this is a 6 minutes + 30 seconds + 1 second (391) grace period to allow outstanding queries to complete
  terminationGracePeriodSeconds: 391

# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
ui:
  # Annotations for ui pods
  annotations: {}

  # Labels for ui pods
  labels: {}

# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
workflows:
  # enabled by default from Chart version 6.0.2 and Retool image 3.6.11 onwards
  # explicitly set other fields as needed

  # enabled: true

  # ADVANCED: The temporal cluster can be scaled separately in the subchart (charts/retool-temporal-services-helm/values.yaml)
  # If your needs require scaling temporal, reach out to us for guidance -- it is likely the bottleneck is DB or worker replicaCount
  worker:
    # A replicaCount of 1 will launch 6 pods -- 1 workflow backend, 1 workflow worker, and 4 pods that make up the executor temporal cluster
    # Scaling this number will increase the number of workflow workers, e.g. a replicaCount of 4
    # will launch 9 pods -- 1 workflow backend, 4 workflow workers, and 4 for temporal cluster
    replicaCount: 1
    # Override the connection pool size used by workflow workers when calling the dbconnector service
    postgresPoolMaxSize: 100

    startupProbe:
      enabled: true
      path: /api/checkHealth
      initialDelaySeconds: 0
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 30

  backend:
    # A replicaCount of 1 will launch 6 pods -- 1 workflow backend, 1 workflow worker, and 4 pods that make up the executor temporal cluster
    # Scaling this number will increase the number of workflow backends, e.g. a replicaCount of 4
    # will launch 9 pods -- 4 workflow backend, 1 workflow workers, and 4 for temporal cluster
    replicaCount: 1
    # Override the connection pool size used by workflow backends when calling the dbconnector service
    postgresPoolMaxSize: 100

    # If necessary, specify the resources to provision the workflows-backend pod separately from the main backend pods.
    # resources:
    #   limits:
    #     cpu: 4096m
    #     memory: 8192Mi
    #   requests:
    #     cpu: 2048m
    #     memory: 4096Mi

    # Startup probe for the workflow-backend pod only. Independent of the
    # top-level startupProbe (main backend). Optional host/scheme: see livenessProbe.
    startupProbe:
      enabled: true
      path: /api/checkHealth
      # host: 127.0.0.1
      # scheme: HTTP
      initialDelaySeconds: 0
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 30

  # Timeout for queries, in ms. This will set the timeout for workflows-related pods only
  # If this value is not set but config.dbConnectorTimeout is, we will set workflows pod timeouts
  # to .Values.config.dbConnectorTimeout
  # dbConnectorTimeout: 120000

  # Annotations for workflows worker and workflow backend pods
  annotations: {}

  # Labels for workflows worker and workflow backend pods
  labels: {}

  # Config for workflows worker pods. Node heap size limits can be overridden here
  # otelCollector can be set to an OpenTelemetry Collector in your k8s cluster. This will configure Temporal metrics collection which
  # provides observability into Workflows worker performance, particularly useful in high QPS use-cases
  # environmentVariables will only be set on the workflows worker
  # only change the CONCURRENT_*_LIMIT values if you have higher load usecases and deploy
  # code_executor. Otherwise, the worker may OOM if the Workflows blocks use too much memory.
  config: {}
  # config: {
  #   nodeOptions: --max_old_space_size=1024
  #   otelCollector: {
  #     enabled: true
  #     endpoint: http://$(HOST_IP):4317
  #   }
  #   environmentVariables: []
  #   - name: WORKFLOW_TEMPORAL_CONCURRENT_TASKS_LIMIT
  #     value: "100"
  #   - name: WORKFLOW_TEMPORAL_CONCURRENT_ACTIVITIES_LIMIT
  #     value: "100"
  # }

  # Resources for the workflow worker only - these are sane inputs that bias towards stability
  # Can adjust but may see OOM errors if memory too low for heavy workflow load
  # To make adjustments to workflows backend, use workflows.backend.resources key.
  resources:
    limits:
      cpu: 2000m
      memory: 8192Mi
    requests:
      cpu: 1000m
      memory: 2048Mi

# Config for optional standalone dbconnector deployment.
# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
dbconnector:
  # By default (disabled), the main backend makes resource queries directly; if
  # enabled, only dbconnector pods will make resource queries on behalf of main
  # backend and workflow-backend pods.
  enabled: false

  java:
    # Disable this to disable Retool's Java dbconnector. Applies whether
    # dbconnector.enabled is true or false.
    enabled: true
    port: 3007

  # Desired pod count for dbconnector deployment.
  replicas: 1

  # (Optional) If set, make dbconnector pods wait the specified time before
  # kubernetes will forcibly kill them when they need to be rescheduled. Setting
  # this to a long duration will minimize disruption to any long-running
  # resource queries during updates, at the cost of making updates take longer.
  terminationGracePeriodSeconds: 391

  # If necessary, specify the resources to provision the workflows-backend pod
  # separately from the main backend pods. If unspecified, uses the same
  # resources configured for main backend.
  # resources:
  #   limits:
  #     cpu: 4096m
  #     memory: 8192Mi
  #   requests:
  #     cpu: 2048m
  #     memory: 4096Mi

  config:
    nodeOptions: '--max_old_space_size=1024'
    postgresPoolMaxSize: 100
    httpAgentMaxSockets: 1000

  # Which port to listen on. Used for both Pods and Service for dbconnector.
  port: 3002

  # Extra annotations specific to standalone dbconnector pods.
  annotations: {}

  startupProbe:
    enabled: true
    path: /api/checkHealth
    initialDelaySeconds: 0
    timeoutSeconds: 10
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 30


# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
multiplayer:
  # Enable this to use Retool's experimental multiplayer editing feature.
  # This feature is not ready for production use; please check with the Retool team before enablement.
  enabled: false

  replicaCount: 1

  # Resources for multiplayer pods
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      memory: "2048Mi"

  # Set environment variables for multiplayer pods, e.g. defining which origin to use
  # environmentVariables:
  #   WEBSOCKET_ALLOWED_ORIGIN: "retool.foo.com"

  # Annotations for multiplayer pods
  annotations: {}

  # Labels for multiplayer pods
  labels: {}

  startupProbe:
    enabled: true
    path: /api/checkHealth
    initialDelaySeconds: 0
    timeoutSeconds: 10
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 30

  # Paths to route to multiplayer pods; defaults to /api/multiplayer. Can specify both path and port.
  ingress:
    # This conditional is dependent on multiplayer.enabled.
    enabled: true
    paths:
      - path: /api/multiplayer
        port: 80

  # HTTPRoute rules for multiplayer when using Gateway API instead of ingress
  httpRoute:
    # This conditional is dependent on multiplayer.enabled.
    enabled: true
    rules:
      - path: /api/multiplayer
        port: 80

  service:
    externalPort: 80
    internalPort: 3001
    annotations: {}
    labels: {}

# MCP enablement examples:
#
# Simplest: use the chart-managed OAuth introspection token. BASE_DOMAIN must
# be the public Retool origin already served by your ingress:
#
# env:
#   BASE_DOMAIN: https://retool.example.com
# mcp:
#   enabled: true
#
# With an explicit public host and an existing Kubernetes Secret:
#
# mcp:
#   enabled: true
#   config:
#     oauthMainDomain: retool.example.com
#     oauthIntrospectionAuthTokenSecretName: retool-mcp-oauth
#     oauthIntrospectionAuthTokenSecretKey: token
#
# The chart injects the token into both MCP and the backend. The MCP ingress
# routes below are enabled by default; reproduce their mapping when ingress is
# managed outside this chart.
# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
mcp:
  # Set to true to deploy the MCP server.
  enabled: false

  replicaCount: 1

  annotations: {}

  labels: {}

  startupProbe:
    enabled: true
    path: /healthcheck
    initialDelaySeconds: 0
    timeoutSeconds: 10
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 18

  # Additional MCP environment variables, including valueFrom entries.
  # Use for settings not exposed under mcp.config.
  environmentVariables: []

  # MCP settings translated to environment variables. RETOOL_BACKEND_URL
  # defaults to http://<fullname>:<service.externalPort>. Other unset settings
  # use the MCP runtime defaults:
  #   maxTransportSessions: 1000
  #   sessionIdleTimeoutMs: 3600000 (1 hour)
  #   sessionSweepIntervalMs: 60000 (1 minute)
  #   sessionGaugeEmitIntervalMs: 30000 (30 seconds)
  config: {}
  # Example overrides:
  # config:
  #   # Internal URL used by the MCP server to call the Retool backend.
  #   # Defaults to the release's internal Retool service when unset.
  #   retoolBackendUrl:
  #
  #   # Optional override for MCP git-server API calls. When unset:
  #   #   - If rr.gitServer.separate.enabled is true, the chart automatically
  #   #     sets RETOOL_GIT_SERVER_URL to the split git-server Service URL.
  #   #   - If rr.gitServer.separate.enabled is false, MCP automatically uses
  #   #     retoolBackendUrl.
  #   retoolGitServerUrl:
  #
  #   # Public Retool origin for client-facing upload URLs when the request Host
  #   # header is insufficient. Do not include /mcp.
  #   mcpServiceExternalUrl:
  #
  #   # Deprecated alias for mcpServiceExternalUrl.
  #   retoolUrl:
  #
  #   # Public Retool host serving OAuth metadata and /api/oauth2/*. Defaults to
  #   # env.BASE_DOMAIN and is usually the Retool application host, not an
  #   # oauth.* subdomain. URL-shaped values are accepted with the scheme removed.
  #   oauthMainDomain:
  #
  #   # Secret containing the OAuth introspection token shared by MCP and the
  #   # backend. When chart-owned secrets are enabled, omitting this generates a
  #   # token. If the token is instead set through mcp.environmentVariables, set
  #   # the same backend value through top-level env, environmentVariables, or
  #   # environmentSecrets.
  #   oauthIntrospectionAuthTokenSecretName:
  #   oauthIntrospectionAuthTokenSecretKey: oauthIntrospectionAuthToken
  #
  #   # Literal token for development only; prefer the secret-backed setting.
  #   oauthIntrospectionAuthToken:
  #
  #   # Secret containing the private key used to sign agent sandbox requests.
  #   # Defaults to the rr.agentSandbox external Secret and jwt-private-key key.
  #   agentSandboxJwtPrivateKeySecretName:
  #   agentSandboxJwtPrivateKeySecretKey: jwt-private-key
  #
  #   # Literal private key for development only. Defaults to
  #   # rr.agentSandbox.jwtPrivateKey when the agent sandbox is enabled.
  #   agentSandboxJwtPrivateKey:
  #
  #   # Node.js options for the MCP server process.
  #   nodeOptions: --max_old_space_size=1024
  #
  #   # Restrict the enabled toolsets. All available toolsets are enabled when unset.
  #   enabledToolsets:
  #     - apps
  #     - resources
  #   # Maximum concurrent transport sessions.
  #   maxTransportSessions: 1000
  #   sessionIdleTimeoutMs: 1800000
  #   sessionSweepIntervalMs: 60000
  #   sessionGaugeEmitIntervalMs: 30000

  # MCP pod resources. The server does not horizontally scale yet, so its
  # default memory limit is higher than multiplayer's.
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      memory: "4096Mi"

  # Backend API Service for the OAuth authorization-server metadata route.
  backendMetadata:
    service:
      enabled: true
      portName: http-api
      externalPort: 3001
      internalPort: 3001
      annotations: {}
      labels: {}

  # Retool 4.0.7 and later support a simplified ingress setup: route all public
  # paths, including /mcp and /.well-known, to the main Retool Service on port
  # 3000. The main backend must also be able to relay /mcp to the in-cluster MCP
  # Service. When mcp.enabled is true, the chart configures the backend with
  # MCP_SERVICE_INGRESS_DOMAIN=http://<fullname>-mcp:<service.externalPort>.
  # You can override it through the top-level env, environmentSecrets, or
  # environmentVariables settings.
  #
  # With that setting, omit or disable the MCP-specific ingress or HTTPRoute
  # rules below and keep only the normal "/" route to <fullname>:3000. Replace
  # <fullname> with this chart release's full name.
  #
  # Retool versions before 4.0.7 require the explicit MCP routes below,
  # rendered before the main Retool route. External ingress must preserve this
  # order and target mapping:
  #   Exact  /.well-known/oauth-authorization-server -> <fullname>-backend-internal:3001
  #   Exact  /.well-known/oauth-protected-resource    -> <fullname>-mcp:4010
  #   Prefix /mcp                                     -> <fullname>-mcp:4010
  #   Prefix /                                         -> <fullname>:3000
  ingress:
    # Also requires mcp.enabled.
    enabled: true
    paths:
      - path: /.well-known/oauth-authorization-server
        pathType: Exact
        target: backendInternal
      - path: /.well-known/oauth-protected-resource
        pathType: Exact
      - path: /mcp
        pathType: Prefix

  # Equivalent Gateway API routes.
  httpRoute:
    # Also requires mcp.enabled.
    enabled: true
    rules:
      - path: /.well-known/oauth-authorization-server
        pathType: Exact
        target: backendInternal
      - path: /.well-known/oauth-protected-resource
        pathType: Exact
      - path: /mcp

  service:
    externalPort: 4010
    internalPort: 4010
    annotations: {}
    labels: {}

# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
codeExecutor:
  # Code executor normally tracks the top-level `image` parameters. Override the
  # tag only when you need a one-off or patched build (e.g. a support build whose
  # tag differs from the backend's); running a code executor version that does not
  # match the backend is not generally supported.

  image:
    repository: tryretool/code-executor-service
    # defaults to top level image.tag
    tag: null
    # pull policy will use the value set in the top-level image.pullPolicy

  replicaCount: 1

  # 6m in-flight request + 30s backend-style preStop buffer + 1s
  terminationGracePeriodSeconds: 391

  # Annotations for code executor pods
  annotations: {}

  # Labels for code executor pods
  labels: {}

  startupProbe:
    enabled: true
    path: /api/checkHealth
    initialDelaySeconds: 0
    timeoutSeconds: 10
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 30

  # Config for code executor. Node heap size limits can be overridden here
  config: {}
  # config: {
  #   nodeOptions: --max_old_space_size=1024
  # }
  volumes: {}
  volumeMounts: {}

  # Config affinity and anti-affinity rules for the code executor pods
  affinity: {}

  # Resources for the code executor. Most common issues will be seen with CPU usage as this will
  # most likely be CPU bound. Adjust the CPU if latency increases under load.
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 1000m
      memory: 1024Mi

  # The code executor runs workflow code inside nsjail sandboxes, which require
  # elevated privileges to create. By default these are granted by running the
  # container as privileged (securityContext.privileged: true). Set
  # useSeccompProfile: true to instead grant only what nsjail needs, far more
  # granularly than the privileged flag: a slightly relaxed version of Docker's
  # default seccomp profile, the NET_ADMIN capability for network isolation, and an
  # unmasked /proc for process resource monitoring. This requires Kubernetes 1.33 or
  # higher (for the ProcMountType and UserNamespacesSupport feature gates) -- do not
  # enable it on older clusters. Pinning codeExecutor.securityContext overrides both
  # paths and is used verbatim.
  useSeccompProfile: false
  seccompLocalhostProfile: profiles/nsjail-seccomp.json

  # Deploy a DaemonSet that loads AppArmor profiles for nsjail on every node.
  # When enabled, the code-executor and js-executor annotations switch from
  # "unconfined" to "localhost/retool-executor". Requires useSeccompProfile:
  # true for code-executor to take effect (js-executor always uses the
  # seccomp/AppArmor path). The DaemonSet itself renders whenever this is
  # truthy and either workflows is enabled (for code-executor) or
  # rr.jsExecutor is enabled.
  #
  # Accepted values:
  #   false    - disabled (default)
  #   true     - alias for "ubuntu"
  #   "ubuntu" - for Ubuntu/Debian nodes
  #   "cos"    - for GKE Container-Optimized OS nodes
  appArmorProfileInstaller: false

# === RR (Retool agent runtime) =============================================
# Master switch for the whole RR stack. Set `rr.enabled: true` to turn on the
# components nested below — jsExecutor, agent, and agentSandbox — with a
# single line. Each component's own `enabled` (left null by default) inherits
# this switch; set a component's `enabled` to true/false to override the master
# for that component only. The gitServer and blobStorage blocks below
# provide the React Retool git server and the object storage the stack needs.
# Not yet annotated: excluded from values.schema.json and README.md. See CONTRIBUTING.md.
# @schema hidden
rr:
  enabled: false

  # JS Executor
  jsExecutor:
    # Inherits .Values.rr.enabled when left unset (null); set true/false to override.
    enabled: null

    image:
      repository: tryretool/js-executor-service
      # defaults to top level image.tag
      tag: null
      pullPolicy: IfNotPresent

    replicaCount: 1

    # Horizontal Pod Autoscaler for the JS executor. Disabled by default;
    # set enabled: true to opt in. When enabled, replicaCount is ignored
    # and the HPA controls the replica count. Scales on CPU and memory
    # Utilization only.
    #
    # Scaling requires a cluster metrics-server (or another metrics.k8s.io
    # implementation). This chart does not install it. If kubectl top pod
    # fails in the namespace, the HPA is created but does not scale.
    #
    # Each Utilization target requires a matching container request
    # (rr.jsExecutor.resources.requests.cpu / .memory). A limits-only or
    # partial resources override leaves those metrics unavailable and the
    # HPA will not scale on the affected resource.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 70
      # Scaling behavior (stabilization windows and policies).
      # behavior: {}

    # 6m in-flight SLF + 30s drain buffer + 1s
    terminationGracePeriodSeconds: 391

    seccompLocalhostProfile: profiles/nsjail-seccomp.json

    # JS-executor-specific environment; not inherited from the top-level
    # .Values.env / .Values.environmentSecrets / .Values.environmentVariables.
    env: {}
    environmentSecrets: []
    environmentVariables: []

    # Annotations for JS executor pods
    annotations: {}

    # Labels for JS executor pods
    labels: {}

    startupProbe:
      enabled: true
      path: /api/health
      initialDelaySeconds: 0
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 30

    volumes: {}
    volumeMounts: {}

    # Config affinity and anti-affinity rules for the JS executor pods
    affinity: {}

    # Resources for the JS executor. Memory request and limit are kept equal:
    # JSE reads its memory limit and rejects requests at 80% of it, so the
    # request must reserve the full amount to avoid premature rejections.
    # HPA Utilization metrics (see autoscaling above) also require these
    # requests; do not drop them if autoscaling is enabled.
    resources:
      limits:
        cpu: '2'
        memory: 6Gi
      requests:
        cpu: '2'
        memory: 6Gi

  # RR Agent: server-side agent loop worker (independent from agents above).
  agent:
    # Inherits .Values.rr.enabled when left unset (null); set true/false to override.
    enabled: null

    # Labels for RR agent worker pods
    labels: {}

    # RR agent configuration
    config: {}

    # Annotations for RR agent worker pods
    annotations: {}

    # RR agent worker configuration
    worker:
      replicaCount: 1

      startupProbe:
        enabled: true
        path: /api/checkHealth
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 30

      resources:
        limits:
          cpu: 2000m
          memory: 4096Mi
        requests:
          cpu: 1000m
          memory: 2048Mi

  # Agent Sandbox Service: sandboxed code execution for AI agents.
  # Deploys a controller (manages sandbox lifecycle), proxy (HTTP proxy for sandbox egress),
  # and ephemeral Job-based sandboxes. Uses Postgres for controller/proxy state.
  agentSandbox:
    # Inherits .Values.rr.enabled when left unset (null); set true/false to override.
    enabled: null

    image:
      repository: tryretool/agent-sandbox-service
      # defaults to top level image.tag
      tag: null
      pullPolicy: IfNotPresent

    # Lightweight init image used by the prepuller and seccomp DaemonSets.
    # Pinning by digest is recommended for production.
    initImage:
      repository: busybox
      tag: '1.37.0'
      # Manifest list digest — set to '' in test environments where images are
      # pre-loaded (containerd 2.0 can't resolve digest references for side-loaded images).
      digest: ''

    # DaemonSets set hostNetwork: true by default
    hostNetwork: true

    # Annotations for agent sandbox pods
    annotations: {}

    # Labels for agent sandbox pods
    labels: {}

    # === Secrets ============================================================
    # Provide each secret as a plaintext value below, OR set externalSecret.name
    # to a pre-existing Secret with keys jwt-public-key, jwt-private-key,
    # encryption-key, api-secret. A plaintext value always wins over the external
    # secret for that key. externalSecret.name covers ONLY these app secrets --
    # it does not source Postgres. To read a DSN from that same Secret, point
    # postgres.urlSecretName at it (see Postgres Option 3 below).
    externalSecret:
      name: ''                 # optional: existing Secret holding the keys below

    jwtPublicKey: ''           # REQUIRED (ES256) unless provided via externalSecret
    jwtPrivateKey: ''          # REQUIRED (ES256) unless provided via externalSecret
    encryptionKey: ''          # REQUIRED: 64 hex chars (openssl rand -hex 32, NOT base64). Proxy throws when serving a sandbox without it; must match the backend's AGENT_SANDBOX_ENCRYPTION_KEY. May instead be supplied via externalSecret.name (encryption-key entry).
    apiSecret: ''              # optional: admin/test endpoints

    # === Postgres state backend =============================================
    # By DEFAULT (all options below left blank) the agent sandbox reuses the
    # backend's Postgres connection from config.postgresql / the postgresql
    # subchart -- same instance and database, separate schema (see schema below).
    # So enabling it on an existing deployment needs nothing here. (Exception:
    # if the backend's DB password is supplied via external secrets / envFrom, it
    # can't be inherited by a separate pod -- set an option below in that case.)
    # To point the sandbox at a different database, set exactly ONE option:
    postgres:
      # -- Option 1: plaintext DSN --
      url: ''

      # -- Option 2: assemble from fields --
      # The password is passed via PGPASSWORD (never embedded in the URL), so any
      # characters are safe and a password-only secret can be reused as-is.
      # Set either password or passwordSecretName.
      # user/database are embedded in the DSN verbatim (user may contain '@', e.g.
      # Azure user@servername); for values with : / ? # use Option 1 or 3.
      host: ''
      port: 5432
      database: ''
      user: ''
      password: ''
      passwordSecretName: ''
      passwordSecretKey: 'password'

      # -- Option 3: DSN from an existing Secret --
      # Set urlSecretName (urlSecretKey defaults to postgres-url). To reuse the
      # Secret in rr.agentSandbox.externalSecret.name, just point urlSecretName at
      # it -- externalSecret.name itself never sources Postgres.
      # The DSN may omit the password; supply it separately via passwordSecretName
      # (above) so an auto-rotated password isn't duplicated into the DSN secret.
      urlSecretName: ''
      urlSecretKey: 'postgres-url'

      # If options 1-3 are ALL unset, the default (inherit config.postgresql)
      # applies -- see the note at the top of this block.

      # -- Optional tuning (defaults shown) --
      schema: 'agent_executor'
      poolMax: 10
      sweeperIntervalMs: 60000

    # Sandbox network access via pasta userspace networking.
    # When enabled, sandboxes get isolated outbound access with L7 filtering.
    sandboxNetwork:
      enabled: true
      # Request smarter-devices/net_tun via resources.limits on sandbox pods.
      # When true, the kubelet grants /dev/net/tun device cgroup access without
      # privileged mode. Requires smarter-device-manager to be running on each
      # node (see deployDaemonSet below).
      devicePlugin: true
      # Deploy the smarter-device-manager DaemonSet from this Helm release.
      # Set to false when another release (or external process) already manages
      # the DaemonSet — only one instance should run per node.
      deployDaemonSet: true
      # HTTP proxy for sandbox egress L7 filtering. Defaults to the in-cluster
      # agent-sandbox-proxy service URL when empty.
      httpProxy: ''

    # smarter-device-manager: registers /dev/net/tun with the kubelet so sandbox
    # pods can request it via resources.limits.
    devicePlugin:
      image:
        repository: ghcr.io/smarter-project/smarter-device-manager
        tag: v1.20.12
      # Number of /dev/net/tun device slots to register.
      # Set high enough to accommodate maxTotalJobs + prewarm pool.
      maxDevices: 130

      # When possible, we want the devicePlugin daemonset to preempt normal pods.
      # Note: in some cases this is inconvenient or unsupported, i.e. in GKE which
      # requires a custom ResourceQuota to use the `system-node-critical`
      # PriorityClass in user namespaces. In those cases, set this to `null`.
      priorityClassName: system-node-critical

    # Seccomp profile path relative to /var/lib/kubelet/seccomp/.
    # The seccomp node-installer DaemonSet copies the profile to this path
    # on every node automatically.
    seccompProfile: retool/gvisor-seccomp.json

    # Deploy an AppArmor profile for agent-sandbox pods. When enabled, the
    # node-installer DaemonSet loads a retool-agent-sandbox profile on every
    # node, and sandbox Jobs use it instead of Unconfined.
    # Accepts: false | true | "ubuntu" | "cos" (see codeExecutor.appArmorProfileInstaller).
    appArmorProfileInstaller: false

    # S3-compatible snapshot storage.
    # When s3Bucket is set, snapshots are persisted to S3 and survive pod restarts.
    snapshotStorage:
      s3Bucket: ''
      s3Endpoint: ''
      s3Region: 'us-east-1'
      # Name of a K8s Secret containing keys awsAccessKeyId and awsSecretAccessKey.
      # If empty, falls back to the main agent sandbox secret.
      credentialsSecretName: ''

    # Sandbox (Job) configuration
    sandbox:
      port: 3017
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: '2'
          memory: 4Gi
      # Pass the sandbox container's CPU limit to build tools (tsc, esbuild, Rolldown, pnpm)
      # so they size their thread pools to it. Without a CPU limit this is the node's CPU count.
      cpuAwareThreads: true
      # Idle timeout (ms) before an unassigned sandbox self-terminates.
      sandboxIdleTimeoutMs: 600000
      # Hard ceiling (ms) on total sandbox lifetime, regardless of activity. When
      # reached, the sandbox is destroyed (deferred until the current agent loop
      # ends). Defaults to 2.5 hours.
      sandboxGlobalLifetimeMs: 9000000
      # Time (ms) the controller waits for a freshly-started sandbox to connect
      # before failing the request. Interactive sandbox boot (gVisor + bundle
      # load) can take ~20-25s; raise this (e.g. 45000) if you see "did not
      # connect within <n>ms" errors on cold starts.
      sandboxReadyTimeoutMs: 20000
      tmpDirSizeLimit: 20Gi
      # Separate limit for the rootfs-appjob volume — the sandbox root filesystem
      # is a static ~600MB extraction, so 2Gi provides headroom without the 20Gi
      # allocated for /tmp.
      rootfsSizeLimit: 2Gi
      # Additional environment variables for sandbox containers.
      extraEnv: []

      # Annotations applied to sandbox Job pods (the pods that run user code).
      # Two do-not-disrupt annotations are applied by default so sandbox pods
      # are protected from eviction on both Karpenter and cluster-autoscaler
      # clusters (GKE, EKS, etc.) out of the box:
      #   karpenter.sh/do-not-disrupt: "true"
      #   cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      # Each is a no-op when the matching autoscaler isn't present. Entries
      # below override a default of the same key and can add new annotations;
      # to allow disruption on a specific autoscaler, override its key (e.g.
      # set cluster-autoscaler.kubernetes.io/safe-to-evict: "true").
      annotations: {}

    # Controller: tracks capacity, assigns sandbox pods, manages scaling
    controller:
      replicaCount: 1
      port: 3018
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Startup probe for the controller. The image entrypoint copies the JS
      # bundle before launching node, which can exceed the hardcoded liveness
      # window (10s delay + 5x10s) under the default CPU limit.
      startupProbe:
        enabled: true
        path: /livez
        # host: 127.0.0.1
        # scheme: HTTP
        initialDelaySeconds: 0
        timeoutSeconds: 5
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 18
      scaling:
        prewarmPoolSize: 5
        maxTotalJobs: 50
        maxConcurrentCreates: 3
        jobRetentionSeconds: 300
        assignedSandboxTtlSeconds: 3600
        reconcileIntervalMs: 5000
        leaderTtlMs: 10000
        leaderRenewMs: 3000
        perUserSandboxLimit: 5

    # Proxy: HTTP proxy for sandbox egress with credential injection.
    # The proxy must be reachable by frontend browsers for WebSocket connections.
    proxy:
      replicaCount: 1
      port: 3019
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 512Mi
      startupProbe:
        enabled: true
        path: /livez
        initialDelaySeconds: 0
        timeoutSeconds: 5
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 18
      allowedDomains: ''
      # URL the proxy uses to reach the Retool backend for token exchange.
      # Defaults to http://<fullname>:3000 (same-cluster backend service).
      backendUrl: ''
      backendDomainSuffixes: ''
      sandboxProxyTimeoutMs: '180000'  # 3 minutes
      # Where the proxy fetches public npm packages. Leave url empty to use
      # registry.npmjs.org. Set it to an internal mirror when sandboxes have no public
      # npm egress — note the *proxy pod* dials it, not the sandboxes, so that is the
      # only network path that has to reach the mirror.
      npmRegistry:
        url: ''
        # bearer | none. `bearer` (the default) attaches a token and refuses to send
        # the request at all when none is available, so a Secret that fails to mount
        # can't silently downgrade to unauthenticated. Use `none` only for a mirror
        # that genuinely allows anonymous reads.
        authMode: bearer
        # Credential for authMode: bearer. Inline, or from an existing Secret, or from
        # a mounted file. Prefer the file when the token rotates — it is re-read on a
        # TTL, so rotation needs no proxy restart. All three are unused by authMode: none.
        authToken: ''
        authTokenSecret:
          name: ''
          key: ''
        authTokenFile: ''
        authTokenTtlMs: ''
      service:
        # Set to LoadBalancer or NodePort to expose the proxy externally.
        type: ClusterIP
        annotations: {}
      # Optional ingress to expose the proxy to frontend browsers for WebSocket connections.
      # This is separate from the main Retool ingress since the proxy typically runs on its own domain.
      ingress:
        enabled: false
        # ingressClassName:
        annotations: {}
        # kubernetes.io/ingress.class: nginx
        # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        host: ''
        # e.g. sandbox.yourdomain.com
        tls: []
        # - secretName: sandbox-tls
        #   hosts:
        #     - sandbox.yourdomain.com

    # Backend integration: these tell server-side Retool callers how to reach agent executor.
    # controllerUrl defaults to the internal controller service URL when empty.
    # proxyUrl defaults to the namespace-qualified in-cluster proxy Service URL:
    # http://<release-fullname>-agent-sandbox-proxy.<namespace>.svc.cluster.local:<proxy.port>
    controllerUrl: ''
    proxyUrl: ''
    # Public URL for frontend browsers to reach the proxy via WebSocket.
    # Leave EMPTY for self-hosted: the backend then serves the sandbox same-origin
    # as the editor (your Retool base URL) and the front server reverse-proxies the
    # /sandbox/* WS+Vite paths to the in-cluster proxy Service — so no dedicated
    # proxy domain or ingress is required, and your catch-all ingress is untouched.
    # Only set this (e.g. https://sandbox.yourdomain.com) if you deliberately want
    # the proxy on a separate domain, in which case also enable proxy.ingress above.
    frontendWsProxyDomain: ''
    # Public URL for proxy domain. Defaults to frontendWsProxyDomain if empty.
    proxyDomain: ''

    # NetworkPolicy: restrict sandbox, controller, and proxy pod traffic.
    # Strongly recommended for production to isolate sandbox egress.
    networkPolicy:
      enabled: false
      # CIDR ranges to block in proxy egress rules. Must stay in sync with
      # DEFAULT_BLOCKED_CIDRS in the agent-executor source.
      blockedRanges:
        - 169.254.0.0/16    # link-local / cloud metadata
        - 10.0.0.0/8        # private (RFC 1918)
        - 172.16.0.0/12     # private (RFC 1918)
        - 192.168.0.0/16    # private (RFC 1918)
        - 100.64.0.0/10     # carrier-grade NAT (RFC 6598)
        - 127.0.0.0/8       # loopback
        - 0.0.0.0/8         # "this network" (RFC 791)
      blockedRanges6:
        - fc00::/7           # IPv6 unique local addresses
        - fe80::/10          # IPv6 link-local
        - '::1/128'         # IPv6 loopback
      # Restrict DNS egress to pods matching this selector (typically kube-dns/coredns).
      # Set dnsSelector and dnsCidrs both empty to allow DNS to any destination
      # (not recommended).
      dnsSelector:
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      # Additional DNS resolver CIDRs allowed on port 53 (UDP/TCP), alongside
      # dnsSelector. REQUIRED with NodeLocal DNSCache (common on GKE), which
      # answers on each node at the kube-dns ClusterIP, so dnsSelector never
      # matches and every lookup is dropped. Add that ClusterIP as a /32:
      #   kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
      # e.g. dnsCidrs: [10.0.0.10/32]
      dnsCidrs: []
      # Extra egress rules for sandbox pods (appended verbatim).
      extraEgress: []
      # Extra egress rules for the controller and proxy (appended verbatim).
      controllerExtraEgress: []
      proxyExtraEgress: []
      # Extra ingress peers (podSelector/namespaceSelector/ipBlock maps) allowed
      # to reach the controller and proxy. The backend, workflow backend,
      # jobs-runner, and Temporal worker pods are always allowed; use this for
      # callers with custom labels.
      extraIngressFrom: []
      # CIDRs allowed in proxy egress even if they fall within blockedRanges
      # (e.g. private backend endpoint). The in-cluster backend pods are
      # allowed automatically unless proxy.backendUrl is set.
      backendAllowlist: []
      # Egress port for DSN-configured Postgres (postgres.url /
      # urlSecretName), whose port Helm cannot read; null disables the
      # Postgres rules. The fields path uses postgres.port and the
      # inherit path uses the backend's Postgres port automatically.
      postgresPort: 5432
      # Postgres destinations allowed on postgresPort: CIDR strings or
      # podSelector/namespaceSelector maps. The inherited in-cluster subchart
      # is allowed automatically; REQUIRED for an external host.
      postgresAllowlist: []
      # Escape hatch: allow Postgres to ANY destination (for urlSecretName
      # DSNs). Reopens blockedRanges on that port.
      postgresAllowAny: false
      # Override the sandbox-pod ingress source selector (defaults to the retool
      # backend pods). Controller and proxy ingress use extraIngressFrom instead.
      ingressFrom: []

    # Node placement overrides (falls back to global nodeSelector/tolerations if empty)
    nodeSelector: {}
    tolerations: []
    affinity: {}

  gitServer:
    # Runs the React Retool Git Server in-process on the main backend pod
    # (SERVICE_TYPE=...,RR_GIT_SERVER). The main backend internally proxies
    # /api/ai/rr/git/v2/* to localhost:RR_GIT_SERVER_PORT, so no extra ingress
    # routing is required. Required for the rr / React Retool app pipeline.
    #
    # When enabled, exactly one of blobStorage.s3, blobStorage.gcs, or
    # blobStorage.azure must be configured below — git_server stores all
    # objects/packs in blob storage. If it isn't, the render FAILS (set
    # skipBlobStorageValidation below to downgrade that to a NOTES.txt warning).
    #
    # Tri-state, like jsExecutor/agent/agentSandbox: leave null to INHERIT the
    # rr.enabled master switch; set true|false to override explicitly.
    enabled: null

    # Optional: number of loose objects before git_server triggers a repack.
    # Backend default is 100; unset to inherit it.
    repackThreshold: ~

    # Escape hatch for the blob-storage validation below. The chart can only
    # inspect blobStorage, env, environmentVariables, and environmentSecrets at
    # template time; it cannot see env vars injected via envFrom (Secret/ConfigMap
    # splat). Set this to true to DOWNGRADE the hard-fail to a non-fatal NOTES.txt
    # warning when RR_BLOB_STORAGE_PROVIDER / RR_DEFAULT_* are provided that way.
    skipBlobStorageValidation: false

    # Optionally split the git server out of the main backend into its own
    # deployment + service (mirrors how the workload is split in Retool Cloud).
    # Requires the git server to be enabled (rr.gitServer.enabled: true, or
    # inherited from rr.enabled). When enabled:
    #   - a dedicated <fullname>-git-server Deployment runs SERVICE_TYPE=RR_GIT_SERVER
    #     (truncated to fit Kubernetes' 63-character DNS label limit when needed)
    #   - the main backend drops RR_GIT_SERVER from its SERVICE_TYPE and proxies git
    #     traffic to the service via RR_GIT_SERVER_HOST / RR_GIT_SERVER_PORT
    #   - the MCP server (if enabled) is auto-pointed at the same service unless
    #     mcp.config.retoolGitServerUrl is set explicitly
    # The blobStorage config below is rendered onto the git-server pod instead of
    # the main backend in this mode.
    separate:
      enabled: false
      replicaCount: 1
      # Port the git server listens on (RR_GIT_SERVER_PORT) and that its service exposes.
      port: 3010
      # Pod resource requests/limits. Falls back to top-level `resources` if unset.
      resources: {}
      # Falls back to top-level `affinity` if unset.
      affinity: {}
      # Annotations/labels applied to the git-server pod template.
      annotations: {}
      labels: {}
      startupProbe:
        enabled: true
        tcpSocket: true
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 18
      # Annotations/labels applied to the git-server Service (kept separate from
      # the pod ones above).
      service:
        annotations: {}
        labels: {}

  # Shared blob-storage config used by git_server, snapshots, and RetoolOS. Set
  # exactly one of s3, gcs, azure. RetoolOS puts its objects under the
  # `retoolos/` prefix, so it can safely reuse the same bucket or container.
  # Renders RR_BLOB_STORAGE_PROVIDER + RR_DEFAULT_<provider>_* env vars on each
  # workload that needs the store.
  #
  # This block can be omitted entirely if RR_BLOB_STORAGE_PROVIDER and the
  # RR_DEFAULT_*_* env vars are provided directly via environmentVariables /
  # environmentSecrets above — the chart detects that and skips this guard.
  #
  # Keyless auth: each provider can authenticate as the pod's own identity
  # instead of a static credential. Leave the credential field unset and set
  # serviceAccount.annotations so the pod carries the right identity:
  #   - s3:    omit accessKeyId/secret -> AWS default chain (EKS IRSA via the
  #            eks.amazonaws.com/role-arn annotation, instance profile, ECS role)
  #   - gcs:   omit credentials -> Application Default Credentials (GKE Workload
  #            Identity via the iam.gke.io/gcp-service-account annotation)
  #   - azure: set accountUrl instead of a connection string -> managed identity
  #            (azure.workload.identity/client-id annotation + the
  #            azure.workload.identity/use: "true" pod label)
  blobStorage: {}
    # s3:
    #   bucket: my-rr-bucket
    #   region: us-east-1
    #   endpoint: ""                              # optional, for S3-compatible (MinIO, R2, etc.)
    #   # Omit accessKeyId + secret to use the AWS default credential chain (IAM role / IRSA).
    #   accessKeyId: AKIA...
    #   # Provide secretAccessKey OR the secretName/secretKey pair below.
    #   secretAccessKey: ""
    #   secretAccessKeySecretName: ""
    #   secretAccessKeySecretKey: secret-access-key
    #
    # gcs:
    #   bucket: my-rr-bucket
    #   # Omit credentials to use Application Default Credentials (Workload Identity).
    #   credentials: ""
    #   credentialsSecretName: ""
    #   credentialsSecretKey: credentials.json
    #
    # azure:
    #   container: my-rr-container
    #   # Provide connectionString OR the secretName/secretKey pair below, OR set
    #   # accountUrl on its own to authenticate via managed identity.
    #   connectionString: ""
    #   connectionStringSecretName: ""
    #   connectionStringSecretKey: connection-string
    #   accountUrl: ""                            # e.g. https://<account>.blob.core.windows.net

