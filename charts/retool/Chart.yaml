    version: 12.1.5
    repository: https://charts.bitnami.com/bitnami
    condition: database.bundled,postgresql.enabled
  - name: retool-temporal-services-helm
    version: 1.1.5
    condition: temporal.bundled,retool-temporal-services-helm.enabled
