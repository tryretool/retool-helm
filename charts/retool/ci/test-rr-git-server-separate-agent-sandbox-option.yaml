# Separate git server + agent sandbox on an image that supports the pg-boss
# R² backend, with no Temporal. The git server and backend should both render
# R2_ORCHESTRATION_BACKEND=postgres.
image:
  tag: 4.47.0

rr:
  gitServer:
    enabled: true
    separate:
      enabled: true

  blobStorage:
    s3:
      bucket: test-rr-bucket
      region: us-east-1

  agentSandbox:
    enabled: true

    image:
      repository: tryretool/agent-sandbox-service
      tag: 3.123.4
      pullPolicy: IfNotPresent

