# Exercises dedicated service accounts for the executors that run user code.
# Overlaid on top of test-install-values.yaml (which enables workflows, and so
# the code executor). The code executor gets a chart-created account, so the
# shared account's cloud identity annotation doesn't reach it; the JS executor
# uses an existing account by name.
#
# Behavioral assertions for this path live in
# .github/test_executor_service_accounts.py.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/retool

codeExecutor:
  serviceAccount:
    create: true
    annotations:
      example.com/owner: retool

rr:
  jsExecutor:
    enabled: true
    serviceAccount:
      name: retool-js-executor
