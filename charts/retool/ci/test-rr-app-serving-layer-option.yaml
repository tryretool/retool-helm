
# R2 app serving layer in its default mode: in-process on the main backend
# (SERVICE_TYPE=...,RR_APP_SERVING_LAYER), with the <fullname>-app-serving-layer
# Service pointing at the backend pods. The separate-deployment mode is covered
# by test-rr-app-serving-layer-separate-option.yaml.
rr:
  gitServer:
    enabled: true

  appServingLayer:
    enabled: true
    domain: apps.example.retool.com
    ingress:
      enabled: true
      ingressClassName: nginx
      tls:
        - secretName: retool-apps-tls
          hosts:
            - "*.apps.example.retool.com"
            - "*.sandboxes.apps.example.retool.com"

  # Derives the editor sandbox root, sandboxes.<appServingLayer.domain>.
  agentSandbox:
    enabled: true
    externalSecret:
      name: agent-sandbox-secrets
    wildcardSandboxes: true

  blobStorage:
    s3:
      bucket: test-rr-bucket
      region: us-east-1
      accessKeyId: AKIATEST
      secretAccessKeySecretName: rr-blob-storage
      secretAccessKeySecretKey: secret-access-key
