rr:

  # Agent Sandbox — sandbox Job pod annotations override.
  #
  # Verifies that rr.agentSandbox.sandbox.annotations merges over the two
  # do-not-disrupt defaults (karpenter.sh/do-not-disrupt and
  # cluster-autoscaler.kubernetes.io/safe-to-evict) and renders valid JSON in
  # the job-template ConfigMap. Here we override the karpenter key (to "false")
  # and add a custom annotation, exercising both the override and add paths.
  # Overlaid on test-install-values.yaml.
  agentSandbox:
    enabled: true

    image:
      repository: tryretool/agent-sandbox-service
      tag: 3.123.4
      pullPolicy: IfNotPresent

    jwtPublicKey: |-
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEljtqa2nhBwe/PqNhWgPHhj0jv8AI
      Y+QUCicYtfv9wLGcEGPQuXoBQtuoIuOwXOdbEWgrQyLdIEb0YjegAW3miA==
      -----END PUBLIC KEY-----
    jwtPrivateKey: |-
      -----BEGIN EC PRIVATE KEY-----
      MHcCAQEEIMFXLiN/YsJv89D2YkEZ6/Dj5fujghENmYTOilwdChU3oAoGCCqGSM49
      AwEHoUQDQgAEljtqa2nhBwe/PqNhWgPHhj0jv8AIY+QUCicYtfv9wLGcEGPQuXoB
      QtuoIuOwXOdbEWgrQyLdIEb0YjegAW3miA==
      -----END EC PRIVATE KEY-----
    encryptionKey: a12b01429fe0fe69a80da94e9e837ab2f1e9bda378ed8a25905a238f6fea6b7a
    apiSecret: test-agent-sandbox-api-secret

    postgres:
      url: postgres://retool:retool@agent-sandbox-db.example.internal:5432/agent_sandbox
      schema: agent_executor
      poolMax: 10

    sandboxNetwork:
      enabled: true
      devicePlugin: false
      deployDaemonSet: false

    sandbox:
      annotations:
        # Override the default karpenter key (e.g. on a cluster-autoscaler-only
        # cluster where Karpenter isn't running).
        karpenter.sh/do-not-disrupt: "false"
        # Add a custom annotation.
        custom.example.com/sandbox: "true"

    proxy:
      service:
        type: ClusterIP
      ingress:
        enabled: false

    networkPolicy:
      enabled: false
