rr:

  # Agent Sandbox served on a per-sandbox wildcard host instead of the shared
  # /sandbox/<id>/ path: frontendWildcardDomain is emitted to the backend, the
  # workflow backend, the workers, and the proxy, and the proxy Ingress fronts the
  # whole wildcard. Also exercises the proxy ingress NetworkPolicy peer with both
  # selectors set, which is how the ingress controller is allowed through from
  # another namespace.
  #
  # Overlaid on test-install-values.yaml. The secret/Postgres shape mirrors
  # test-agent-sandbox-inline-secrets-option.yaml.
  agentSandbox:
    enabled: true

    jwtPublicKey: '-----BEGIN PUBLIC KEY-----\nMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEljtqa2nhBwe/PqNhWgPHhj0jv8AIY+QUCicYtfv9wLGcEGPQuXoBQtuoIuOwXOdbEWgrQyLdIEb0YjegAW3miA==\n-----END PUBLIC KEY-----'
    jwtPrivateKey: '-----BEGIN EC PRIVATE KEY-----\nMHcCAQEEIMFXLiN/YsJv89D2YkEZ6/Dj5fujghENmYTOilwdChU3oAoGCCqGSM49AwEHoUQDQgAEljtqa2nhBwe/PqNhWgPHhj0jv8AIY+QUCicYtfv9wLGcEGPQuXoBQtuoIuOwXOdbEWgrQyLdIEb0YjegAW3miA==\n-----END EC PRIVATE KEY-----'
    encryptionKey: a12b01429fe0fe69a80da94e9e837ab2f1e9bda378ed8a25905a238f6fea6b7a

    postgres:
      url: postgres://retool:retool@agent-sandbox-db.example.internal:5432/agent_sandbox
      schema: agent_executor

    proxy:
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: nginx
        host: "*.sandboxes.example.com"
        tls:
          - secretName: agent-sandbox-wildcard-tls
            hosts:
              - "*.sandboxes.example.com"
        networkPolicy:
          namespaceSelector:
            kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            app.kubernetes.io/name: ingress-nginx

    frontendWildcardDomain: sandboxes.example.com

    networkPolicy:
      enabled: true
      postgresAllowlist:
        - 10.100.0.0/16
