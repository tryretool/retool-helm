# Retool-specific secrets. Every other manifest references this one Secret by key.
#
# Fill in every value before applying. Suggested generation commands:
#   encryption-key, jwt-secret:          openssl rand -base64 32
#   agent-sandbox-encryption-key:        openssl rand -hex 32          # MUST be 64 hex chars
#   agent-sandbox-api-secret:            openssl rand -hex 32
#   agent-sandbox ES256 keypair:
#     openssl ecparam -name prime256v1 -genkey -noout -out jwt.key
#     openssl pkcs8 -topk8 -nocrypt -in jwt.key -out jwt-private.pem
#     openssl ec -in jwt.key -pubout -out jwt-public.pem
#   The PEM values are accepted verbatim (multi-line) or base64-encoded.
#
# The AGENT_SANDBOX_* values must be identical on the backend, the R2 agent worker,
# the agent-sandbox controller, the proxy and the sandbox pods (see r2.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: retool-secrets
  namespace: retool
type: Opaque
stringData:
  # Core Retool
  license-key: "REPLACE_WITH_LICENSE_KEY"
  jwt-secret: "REPLACE_WITH_RANDOM_STRING"
  encryption-key: "REPLACE_WITH_RANDOM_STRING"
  # Password for the externally hosted Postgres (host/user/db are inlined as env vars).
  postgresql-password: "REPLACE_WITH_POSTGRES_PASSWORD"

  # Agent Sandbox (R2): ES256 keypair for sandbox tokens, AES key for credential
  # encryption, admin secret for the executor's test endpoints.
  agent-sandbox-jwt-private-key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ES256_PRIVATE_KEY
    -----END PRIVATE KEY-----
  agent-sandbox-jwt-public-key: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ES256_PUBLIC_KEY
    -----END PUBLIC KEY-----
  agent-sandbox-encryption-key: "REPLACE_WITH_64_HEX_CHARS"
  agent-sandbox-api-secret: "REPLACE_WITH_RANDOM_STRING"

  # Blob storage used by the RR git server and R2 snapshots (S3 shown; GCS/Azure use
  # RR_DEFAULT_GCS_* / RR_DEFAULT_AZURE_* instead). Delete these two keys and the
  # matching env vars to use the pod's IAM role (IRSA / instance profile) instead.
  rr-s3-access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  rr-s3-secret-access-key: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
