# Agent Sandbox: the infrastructure that runs the R2 coding agent for each user in an
# isolated gVisor sandbox. See agent_executor/RUNBOOK.md in retool_development for the full
# picture. Depends on secrets.yaml (ES256 keypair, encryption key, API secret, DB password)
# and on the `retool` Service from backend.yaml.
#
# Pods you will see in the namespace:
#   retool-agent-sandbox-controller-*   Deployment. Leader-elected over the Postgres state
#                                        store. Creates/retires sandbox Jobs, keeps
#                                        PREWARM_POOL_SIZE idle sandboxes warm, hands one to
#                                        the R2 agent worker on POST /assign (port 3018).
#   retool-agent-sandbox-proxy-*        Deployment. The only network path out of a sandbox.
#                                        Filters egress, swaps the sandbox's facade token for
#                                        real credentials on calls to BACKEND_URL, and relays
#                                        the editor's WebSocket/Vite traffic in (port 3019).
#   retool-agent-sandbox-job-*          One Job pod per sandbox, created by the controller
#                                        from the job-template ConfigMap below. Runs the
#                                        executor host (port 3017), which boots one gVisor
#                                        (runsc) sandbox containing the agent and the
#                                        user's app checkout.
#   retool-agent-sandbox-node-installer-*  DaemonSet. Copies gvisor-seccomp.json onto every
#                                        node, then sleeps.
#   retool-agent-sandbox-device-plugin-*   DaemonSet (smarter-device-manager). Registers
#                                        /dev/net/tun with the kubelet so sandbox pods can
#                                        request it for pasta networking.
#   retool-agent-sandbox-image-prepuller-* DaemonSet. Pre-pulls the sandbox image on every
#                                        node; the controller also watches it to detect
#                                        image rollouts.
#
# Request flow: R2 agent worker -> controller /assign -> sandbox pod /run-agent;
# sandbox -> proxy -> retool:3000; browser -> retool:3000 (/sandbox/*) -> proxy -> sandbox.
# The controller and proxy share the `agent_executor` schema of the Retool Postgres database
# (STATE_BACKEND=postgres), so no Redis is required.
# =============================================================================
# Agent Sandbox: gVisor seccomp profile, installed on every node
# =============================================================================
