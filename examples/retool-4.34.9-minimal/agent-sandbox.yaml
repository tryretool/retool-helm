apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: retool-agent-sandbox-node-installer
  namespace: retool
  labels:
    retoolService: retool-agent-sandbox-node-installer
spec:
  selector:
    matchLabels:
      retoolService: retool-agent-sandbox-node-installer
  template:
    metadata:
      labels:
        retoolService: retool-agent-sandbox-node-installer
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: install-seccomp
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              DEST=/host-seccomp/retool/gvisor-seccomp.json
              mkdir -p "$(dirname "$DEST")"
              cp /seccomp-profile/gvisor-seccomp.json "$DEST"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: seccomp-profile
              mountPath: /seccomp-profile
            - name: host-seccomp
              mountPath: /host-seccomp
      containers:
        - name: pause
          image: busybox:1.37.0
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: seccomp-profile
          configMap:
            name: retool-agent-sandbox-seccomp
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
---
# =============================================================================
# Agent Sandbox: /dev/net/tun device plugin (sandbox networking via pasta)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: retool-agent-sandbox-device-plugin
  namespace: retool
data:
  conf.yaml: |
    - devicematch: ^net/tun$
      nummaxdevices: 130
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: retool-agent-sandbox-device-plugin
  namespace: retool
  labels:
    retoolService: retool-agent-sandbox-device-plugin
spec:
  selector:
    matchLabels:
      retoolService: retool-agent-sandbox-device-plugin
  template:
    metadata:
      labels:
        retoolService: retool-agent-sandbox-device-plugin
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: smarter-device-manager
          image: ghcr.io/smarter-project/smarter-device-manager:v1.20.12
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /tmp/termination-log
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: config
              mountPath: /root/config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
        - name: config
          configMap:
            name: retool-agent-sandbox-device-plugin
---
# =============================================================================
# Agent Sandbox: image prepuller (the controller also reads it to detect image rollouts)
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: retool-agent-sandbox-image-prepuller
  namespace: retool
  labels:
    retoolService: retool-agent-sandbox-image-prepuller
spec:
  selector:
    matchLabels:
      retoolService: retool-agent-sandbox-image-prepuller
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        retoolService: retool-agent-sandbox-image-prepuller
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 5
      initContainers:
        - name: pull-image
          image: tryretool/agent-sandbox-service:4.34.9-stable
          imagePullPolicy: IfNotPresent
          command: ["true"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: pause
          image: busybox:1.37.0
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
---
# =============================================================================
# Agent Sandbox: controller RBAC (creates/deletes sandbox Jobs, reads pods and the template)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retool-agent-sandbox-controller
  namespace: retool
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retool-agent-sandbox-controller
  namespace: retool
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retool-agent-sandbox-controller
  namespace: retool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: retool-agent-sandbox-controller
subjects:
  - kind: ServiceAccount
    name: retool-agent-sandbox-controller
    namespace: retool
---
# =============================================================================
# Agent Sandbox: Job template the controller stamps out for every sandbox pod.
# The controller replaces __IMAGE_TAG__ with its DEPLOYED_IMAGE_TAG env var.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: retool-agent-sandbox-job-template
  namespace: retool
data:
  job-template.json: |
    {
      "apiVersion": "batch/v1",
      "kind": "Job",
      "metadata": {
        "labels": {
          "retoolService": "retool-agent-sandbox",
          "app.kubernetes.io/name": "retool-agent-sandbox"
        }
      },
      "spec": {
        "backoffLimit": 0,
        "ttlSecondsAfterFinished": 300,
        "template": {
          "metadata": {
            "annotations": {
              "karpenter.sh/do-not-disrupt": "true",
              "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
            },
            "labels": {
              "retoolService": "retool-agent-sandbox",
              "app.kubernetes.io/name": "retool-agent-sandbox"
            }
          },
          "spec": {
            "restartPolicy": "Never",
            "subdomain": "retool-agent-sandbox-pods",
            "automountServiceAccountToken": false,
            "initContainers": [
              {
                "name": "rootfs-etc-copy",
                "image": "tryretool/agent-sandbox-service:__IMAGE_TAG__",
                "command": ["/bin/sh", "-c", "cd /opt/sandbox-env/rootfs/etc && find . -maxdepth 1 -mindepth 1 ! -name shadow -exec cp -R {} /mnt/etc/ \\;"],
                "securityContext": {
                  "runAsUser": 1001,
                  "runAsGroup": 1001,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {"drop": ["ALL"]}
                },
                "volumeMounts": [
                  {"name": "rootfs-etc", "mountPath": "/mnt/etc"}
                ],
                "resources": {
                  "requests": {"cpu": "10m", "memory": "16Mi"},
                  "limits": {"cpu": "100m", "memory": "32Mi"}
                }
              }
            ],
            "containers": [
              {
                "name": "agent-sandbox",
                "image": "tryretool/agent-sandbox-service:__IMAGE_TAG__",
                "ports": [{"containerPort": 3017, "protocol": "TCP"}],
                "securityContext": {
                  "runAsUser": 1001,
                  "runAsGroup": 1001,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {"drop": ["ALL"]},
                  "seccompProfile": {"type": "Localhost", "localhostProfile": "retool/gvisor-seccomp.json"},
                  "appArmorProfile": {"type": "Unconfined"}
                },
                "env": [
                  {"name": "NODE_ENV", "value": "production"},
                  {"name": "EXECUTOR_PORT", "value": "3017"},
                  {"name": "POD_NAME", "valueFrom": {"fieldRef": {"fieldPath": "metadata.name"}}},
                  {"name": "POD_UID", "valueFrom": {"fieldRef": {"fieldPath": "metadata.uid"}}},
                  {"name": "POD_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.podIP"}}},
                  {"name": "SANDBOX_NETWORK_ENABLED", "value": "true"},
                  {"name": "SANDBOX_HTTP_PROXY", "value": "http://retool-agent-sandbox-proxy:3019"},
                  {"name": "SANDBOX_BACKEND_URL", "value": "http://retool:3000"},
                  {"name": "SANDBOX_IDLE_TIMEOUT_MS", "value": "600000"},
                  {"name": "SANDBOX_GLOBAL_LIFETIME_MS", "value": "9000000"},
                  {"name": "SANDBOX_READY_TIMEOUT_MS", "value": "20000"},
                  {"name": "SANDBOX_CPU_LIMIT", "valueFrom": {"resourceFieldRef": {"resource": "limits.cpu", "divisor": "1"}}},
                  {"name": "AGENT_SANDBOX_JWT_PUBLIC_KEY", "valueFrom": {"secretKeyRef": {"name": "retool-secrets", "key": "agent-sandbox-jwt-public-key"}}},
                  {"name": "EXECUTOR_API_SECRET", "valueFrom": {"secretKeyRef": {"name": "retool-secrets", "key": "agent-sandbox-api-secret"}}}
                ],
                "volumeMounts": [
                  {"name": "run", "mountPath": "/run"},
                  {"name": "tmp", "mountPath": "/tmp"},
                  {"name": "rootfs-appjob", "mountPath": "/opt/sandbox-env/rootfs/app/job"},
                  {"name": "rootfs-etc", "mountPath": "/opt/sandbox-env/rootfs/etc"}
                ],
                "resources": {
                  "requests": {"cpu": "1", "memory": "2Gi"},
                  "limits": {"cpu": "2", "memory": "4Gi", "smarter-devices/net_tun": 1}
                }
              }
            ],
            "volumes": [
              {"name": "run", "emptyDir": {"medium": "Memory", "sizeLimit": "64Mi"}},
              {"name": "tmp", "emptyDir": {"sizeLimit": "20Gi"}},
              {"name": "rootfs-appjob", "emptyDir": {"sizeLimit": "2Gi"}},
              {"name": "rootfs-etc", "emptyDir": {"medium": "Memory", "sizeLimit": "4Mi"}}
            ]
          }
        }
      }
    }
---
# Headless Service: sandbox pods register as <pod>.retool-agent-sandbox-pods.retool.svc so
# the controller, proxy and R2 worker can address a specific pod.
apiVersion: v1
kind: Service
metadata:
  name: retool-agent-sandbox-pods
  namespace: retool
spec:
  clusterIP: None
  selector:
    retoolService: retool-agent-sandbox
  ports:
    - name: http
      port: 3017
      targetPort: 3017
---
# =============================================================================
# Agent Sandbox: controller
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retool-agent-sandbox-controller
  namespace: retool
  labels:
    retoolService: retool-agent-sandbox-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      retoolService: retool-agent-sandbox-controller
  template:
    metadata:
      labels:
        retoolService: retool-agent-sandbox-controller
    spec:
      serviceAccountName: retool-agent-sandbox-controller
      automountServiceAccountToken: true
      containers:
        - name: controller
          image: tryretool/agent-sandbox-service:4.34.9-stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3018
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: production
            - name: AGENT_SANDBOX_ROLE
              value: controller
            - name: CONTROLLER_PORT
              value: "3018"

            # State store: the Retool Postgres database, separate schema. The password is
            # passed via PGPASSWORD so it never appears in the URL.
            - name: STATE_BACKEND
              value: postgres
            - name: AGENT_SANDBOX_POSTGRES_URL
              value: postgres://retool@retool-db.abc123.us-east-1.rds.amazonaws.com:5432/hammerhead_production?sslmode=no-verify
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: retool-secrets
                  key: postgresql-password
            - name: AGENT_SANDBOX_POSTGRES_SCHEMA
              value: agent_executor

            # Kubernetes orchestration
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JOB_NAME_PREFIX
              value: retool-agent-sandbox-job
            - name: JOB_APP_LABEL
              value: retool-agent-sandbox
            - name: EXECUTOR_SERVICE_NAME
              value: retool-agent-sandbox-pods
            - name: JOB_TEMPLATE_CONFIGMAP
              value: retool-agent-sandbox-job-template
            - name: DAEMONSET_NAME
              value: retool-agent-sandbox-image-prepuller
            # Must match the sandbox image tag; substituted into the job template.
            - name: DEPLOYED_IMAGE_TAG
              value: 4.34.9-stable

            # Capacity
            - name: PREWARM_POOL_SIZE
              value: "2"
            - name: MAX_TOTAL_JOBS
              value: "20"
            - name: MAX_CONCURRENT_CREATES
              value: "3"
            - name: JOB_RETENTION_SECONDS
              value: "300"

            - name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: retool-secrets
                  key: agent-sandbox-jwt-public-key
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: retool-agent-sandbox-controller
  namespace: retool
spec:
  type: ClusterIP
  selector:
    retoolService: retool-agent-sandbox-controller
  ports:
    - name: http
      port: 3018
      targetPort: http
---
# =============================================================================
# Agent Sandbox: proxy (sandbox egress filter, credential injection, WebSocket relay)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retool-agent-sandbox-proxy
  namespace: retool
  labels:
    retoolService: retool-agent-sandbox-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      retoolService: retool-agent-sandbox-proxy
  template:
    metadata:
      labels:
        retoolService: retool-agent-sandbox-proxy
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      containers:
        - name: proxy
          image: tryretool/agent-sandbox-service:4.34.9-stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3019
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: production
            - name: AGENT_SANDBOX_ROLE
              value: proxy
            - name: PROXY_PORT
              value: "3019"

            - name: STATE_BACKEND
              value: postgres
            - name: AGENT_SANDBOX_POSTGRES_URL
              value: postgres://retool@retool-db.abc123.us-east-1.rds.amazonaws.com:5432/hammerhead_production?sslmode=no-verify
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: retool-secrets
                  key: postgresql-password
            - name: AGENT_SANDBOX_POSTGRES_SCHEMA
              value: agent_executor

            # Requests from sandboxes to this origin get the real credentials swapped in.
            - name: BACKEND_URL
              value: http://retool:3000
            - name: AGENT_SANDBOX_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: retool-secrets
                  key: agent-sandbox-encryption-key
            - name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: retool-secrets
                  key: agent-sandbox-jwt-public-key

            # Reaching sandbox pods
            - name: EXECUTOR_PORT
              value: "3017"
            - name: EXECUTOR_SERVICE_NAME
              value: retool-agent-sandbox-pods
            - name: K8S_NAMESPACE
              value: retool
            - name: SANDBOX_PROXY_TIMEOUT_MS
              value: "180000"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: retool-agent-sandbox-proxy
  namespace: retool
spec:
  type: ClusterIP
  selector:
    retoolService: retool-agent-sandbox-proxy
  ports:
    - name: tcp-proxy
      port: 3019
      targetPort: http
